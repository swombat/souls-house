# config/credentials/production.example.yml
#
# Template for a fork's production credentials. This file is committed and
# holds no real secrets — copy the blocks you need into
# `bin/rails credentials:edit --environment production`, which opens the
# real (encrypted, gitignored-key) file. Do not commit that file's key.
#
# Upstream's config/credentials/production.yml.enc is committed to this repo
# but a fresh clone has no production.key. Interactive `bin/house init` can
# back up that ciphertext, generate a new key, seed this template, and open
# the editor. It leaves existing keys untouched and restores the old state
# if editing fails. For manual setup, first back up and move aside the old
# ciphertext, then run `bin/rails credentials:edit --environment production`.
# If this is an existing installation, recover its key instead of replacing
# its credentials.
# That generates a fresh production.key + production.yml.enc, independent of
# upstream's, with no dependency on any secret you don't have. See
# docs/2026-09-07-credentials-audit-from-lume.md for the full audit this
# template is derived from.
#
# Every block below is either REQUIRED, REQUIRED only under a condition, or
# OPTIONAL — an integration that degrades cleanly (raises only when a
# resident actually tries to use it) if you omit it entirely.

# REQUIRED when HOUSE_STORAGE=s3 (the default; see config/house.env.example).
# config/environments/production.rb selects Active Storage's :amazon service
# unless SOULSHOUSE_STORAGE=local. Also required for the nightly
# DatabaseBackupJob, which config/recurring.yml runs every day at 4am via
# FullBackupJob — so postgres_bucket is not truly optional in a default
# production deploy, despite only being touched by that one job.
# Set HOUSE_STORAGE=local in config/house.env instead if you don't want S3.
aws:
  access_key_id: ...
  secret_access_key: ...
  s3_region: ...
  s3_bucket: ...
  postgres_bucket: ...   # database backup destination bucket (FullBackupJob, daily)

# OPTIONAL — omit this whole block to run without outgoing mail. Guarded in
# config/environments/production.rb: mail delivery only configures when this
# block is present; otherwise deliveries are silently no-ops.
# smtp:
#   server: ...
#   port: 587
#   domain: souls.house
#   user_name: ...
#   password: ...

# OPTIONAL — omit to run Honeybadger unconfigured (no-op error reporting).
# honeybadger:
#   api_key: ...

# OPTIONAL — system-wide AI provider keys, each also settable via a matching
# ENV var (see Account::AI_PROVIDERS in app/models/account.rb) and each
# overridable per-account with the account's own key. Omit any you don't
# want to provide platform-wide; the app runs fine with none of them.
# ai:
#   claude:
#     api_token: ...       # ANTHROPIC_API_KEY — powers Claude as a system model
#   open_ai:
#     api_token: ...       # OPENAI_API_KEY — powers OpenAI as a system model
#   openrouter:
#     api_token: ...       # OPENROUTER_API_KEY — powers OpenRouter as a system model
#   gemini:
#     api_token: ...       # GEMINI_API_KEY — powers Gemini as a system model, and
#                           # app/services/youtube_video_reader.rb's YouTube reading
#   xai:
#     api_token: ...       # XAI_API_KEY — powers Grok as a system model, and
#                           # app/services/x_reader.rb's X reading
#   zai:
#     api_token: ...       # ZAI_API_KEY — powers Z.ai as a system model
#   moonshot:
#     api_token: ...       # MOONSHOT_API_KEY — powers Moonshot/Kimi as a system model
#   minimax:
#     api_token: ...       # MINIMAX_API_KEY — powers MiniMax as a system model
#   eleven_labs:
#     api_token: ...       # powers lib/eleven_labs_stt.rb and _tts.rb speech features

# OPTIONAL — each block below enables one external integration. All raise a
# plain ArgumentError only when a resident actually starts that integration's
# OAuth/API flow, never at boot.
# oura:
#   client_id: ...
#   client_secret: ...
# dropbox:
#   app_key: ...
# google_workspace:
#   client_id: ...
#   client_secret: ...
# github:
#   client_id: ...
#   client_secret: ...
# x:
#   client_id: ...
#   client_secret: ...

# OPTIONAL and superseded — set SOULSHOUSE_PUBLIC_URL in config/house.env
# instead (config/initializers/house.rb prefers it over this credential).
# Only needed here if you'd rather not use the env var.
# app:
#   url: https://your-fork.example.com

# OPTIONAL — HMAC key signing agent-issued credentials
# (app/lib/agent_credentials_encryptor.rb). Falls back to Rails' own
# secret_key_base if omitted, which is fine for a single-house deploy.
# agent_credentials_signing_key: ...
