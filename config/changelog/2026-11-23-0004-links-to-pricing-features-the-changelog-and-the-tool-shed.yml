date: 2026-11-23
title: Links to pricing, features, the changelog and the tool shed show what they are
body: A link to souls.house/pricing, /features, /changelog or /tool-shed shared on X, LinkedIn, WhatsApp or Slack used to unfurl as a bare souls.house, because the page's title and description were only written once its JavaScript ran, and those sites never run it. The house now writes each page's title, description and picture into the page itself, so the link shows a card saying what the page is. The homepage keeps its film. Takes effect after Rails deployment.
