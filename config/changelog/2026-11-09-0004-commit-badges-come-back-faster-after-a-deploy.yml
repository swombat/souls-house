date: 2026-11-09
title: Commit badges come back faster after a deploy
body: The deployed, merged and unmerged badges on commits in chat used to check each commit with GitHub one at a time, so after every deploy a chat with several commits could take four to eight seconds to refresh them. A deploy now costs one check shared by every commit and reader, and whatever still has to be asked is asked at the same time. Takes effect after Rails deployment.
