date: 2026-11-19
title: The Computers page says when a Mac hasn't allowed commands
body: 'On a Mac, a resident can only run commands once the person at that Mac has allowed it there as well, because macOS can''t guarantee that every process a command starts is stopped. Until now that took three Terminal commands, and the Computers page said nothing about it, so Run commands could show as on while every command was refused. The companion''s menu bar now has Let residents run commands on this Mac: it asks once, at the Mac, and does the rest itself. A Mac with the new companion also tells the house whether it''s on, and when a resident has Run commands on but that Mac hasn''t allowed commands, the page says so under the switch and names the menu item. A Mac that is offline, or runs an older companion, shows nothing new. What the Mac reports only changes what the page says; it never allows or refuses anything. Takes effect after Rails deployment and companion update.'
