date: 2026-11-25
title: A failed run says when its conversation's model left the resident's list
body: 'When a conversation had selected a model that the resident''s list of models for conversations no longer carries, the room was told, but the run itself, in the resident''s Runs tab, said only that it failed and the cause wasn''t identified. The run now records why: the selected model is no longer on the list, naming the model, or another of the house''s checks refused that model, with the check''s own reason. Neither is described as the provider refusing it. A run is now said to have had its model refused by the subscription only when the runtime''s own record of the failure says the model isn''t available on the plan, account or subscription, and the run''s line then quotes it. Before, a tag that could come from the run''s general output was enough, so the room could be told it was a subscription problem when the run had actually failed for another reason, or when the provider had rejected the model without saying why. Those runs now show as ending in an error with the runtime''s own words, or, when the runtime recorded no words at all, as failing with the cause not identified. Takes effect after Rails deployment.'
