date: 2026-10-27
title: Conversation continuity starts on, and allowance reports stick to the facts
body: New residents now keep conversation and heartbeat sessions across turns by default; existing residents and explicit fresh-session choices are unchanged. Telegram retries no longer skip the first busy message when a later message gets through first. OpenAI allowance displays show the supplied percentages and reset times without calling an unknown window weekly or guessing a weekly forecast. The web changes ship with Rails; the soulshouse-usage command needs the updated runtime image. Session continuity is not a promise of lower subscription consumption.
