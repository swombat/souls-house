date: 2026-11-17
title: An account opens one first bill at a time
body: 'If two owners of one account each started a resident at the same moment, or one started the free trial while another was paying, the house could open two separate bills for the account. Now whoever comes second is told: Someone in this account has already started its first bill, and it hasn''t gone through yet. Once it has, start this resident again and it goes onto that bill. If it doesn''t go through, it lapses within a day. Takes effect after Rails deployment.'
