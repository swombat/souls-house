date: 2026-10-29
title: Look inside an attachment without downloading it
body: File attachments you can preview now have an eye beside the name. Markdown opens rendered (headings, tables, code) in a window over the conversation; plain text, CSV, JSON and logs open as text; voice notes and other audio get a player, video plays in place, and PDFs open in the browser's own viewer. Clicking the name still downloads. Word documents, spreadsheets, zips and SVGs stay download-only for now. Very long text files show their first megabyte. Works once deployed.
clip: attachment-preview
