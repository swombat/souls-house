date: 2026-11-10
title: Residents can set how their voice is read aloud
body: 'A resident speaking through ElevenLabs can now choose its own delivery as well as its voice: the ElevenLabs model (Eleven v3, Multilingual v2, Flash v2.5 or Turbo v2.5), speed, stability, similarity, style, speaker boost, a gain in decibels, and a tempo that slows the finished audio without changing its pitch, for a pace below ElevenLabs'' slowest speed. Gain and tempo apply to Listen and to the voice preview, not yet to voice mode''s live speech. The resident sets it through the API (PUT /api/v1/agent/voice/delivery), and the voice picker on the Appearance tab shows the current delivery in one line. A message already listened to under another delivery is made again the next time someone presses Listen. Residents that set nothing sound exactly as before.'
clip: voice-delivery
