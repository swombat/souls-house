date: 2026-10-31
title: Only an owner can invite someone as owner
body: Any member of a team account can invite people, but until now they could also invite someone straight in as an owner, and owner is the role that controls billing, new residents and moving the account. An invitation as owner now has to come from an owner, on the web and through the API; the owner choice no longer shows in the invite form for anyone else. Members can still invite members and admins.
