date: 2026-11-10
title: A Computers page for the companion
body: Account settings has a new Computers tab. It lists each computer enrolled with souls.house companion, whether it is connected or paused, and which residents it serves, with each resident's folders and whether they can read or also write there. An owner or admin can switch each resident's permission to run commands and to use apps (desktop) on or off there. Turning one on first shows what it allows and asks you to confirm. Any change stops work already running on that computer. The same page pauses, resumes or removes a computer. Other members see the page but cannot change it. Changing a resident's folders still needs a new enrollment. Desktop also still needs the menu bar switch on the computer itself. Takes effect after Rails deployment.
clip: computers-page
