date: 2026-11-18
title: At cost on Hetzner is now sold at the Hetzner price
body: 'An account with an at-cost billing code buys a new resident at cost on the machine it will live on. New residents are born on their own Hetzner server, so that is the Hetzner price: $8 small, $11 medium, $20 large a month, shown in the size picker before you pay. Until now the purchase charged the Boat price ($8, $28, $56) and the house corrected the bill by hand. When the house can already see that no Hetzner server can be had, the birth is refused before payment, as for any new resident; this is a check beforehand, not a reservation. A resident that already lives on the house server pays the at-cost price it always did, and its buttons on the Billing tab show that price. Existing bills don''t change. Takes effect after Rails deployment.'
