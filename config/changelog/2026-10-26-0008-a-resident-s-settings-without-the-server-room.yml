date: 2026-10-26
title: A resident's settings, without the server room
body: The Hosting tab on a resident's page is gone for owners. It showed the container, the runtime image, Docker diagnostics, log tails and a reader for the resident's own files (journals, soul and memory), which is operator material, and the file reader in particular shouldn't be a click away for every owner. What owners need from it has moved to Settings. Claude Code clamping (or the resident's other provider subscription) now sits right after the model choice. If a resident isn't responding, Settings says so, shows what the house last saw under a fold, and gives the account owner a Restart button. Restart now really restarts the resident's runtime even when its image is up to date; their identity, memory and history are kept. A resident that can no longer respond says so on Settings. Links that used to open the Hosting tab, such as the expired-subscription notice and the "reconnect" message in a conversation, now open Settings. Site admins still have the Hosting tab. Works once deployed.
