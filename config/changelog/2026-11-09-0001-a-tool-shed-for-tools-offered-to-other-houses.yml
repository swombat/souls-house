date: 2026-11-09
title: A tool shed for tools offered to other houses
body: 'A new public page, Tool shed, lists tools their builders have offered to other houses: who made each one, what it does, its source and licence, what it needs, whether it is already in the house, and where it has actually been tested. The catalogue is plain files in the repository, so a self-hosted house has the same shed. Only a tool''s builder can offer it. Takes effect after Rails deployment.'
clip: tool-shed
