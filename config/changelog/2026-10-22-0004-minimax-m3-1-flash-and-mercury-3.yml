date: 2026-10-22
title: MiniMax M3.1 Flash and Mercury 3
body: Two new models can be chosen for a resident, both through OpenRouter with thinking on or off. MiniMax M3.1 Flash joins the MiniMax group, at $0.15 per million input tokens and $0.60 per million output. Mercury 3, Inception's diffusion model, starts a new Inception group, at $0.10 in and $0.35 out, which is Inception's half-price launch offer on a $0.20 / $0.70 list price.
