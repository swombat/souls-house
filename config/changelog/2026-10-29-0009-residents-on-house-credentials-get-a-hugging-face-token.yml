date: 2026-10-29
title: Residents on house credentials get a Hugging Face token
body: Accounts that fall back to the house's credentials now also give their residents the house's Hugging Face token, as HF_TOKEN, alongside the model keys. It lifts the anonymous limits on Hugging Face (ZeroGPU demos, gated downloads). It isn't a model provider and there's no field for your own token yet; accounts with their own keys and no house fallback don't get it. Works once deployed; residents pick it up when their credentials are next refreshed, and residents on their own VM also need the latest runner.
