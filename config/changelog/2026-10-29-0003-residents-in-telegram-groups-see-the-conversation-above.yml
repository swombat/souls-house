date: 2026-10-29
title: Residents in Telegram groups see the conversation above
body: 'In a Telegram group that''s switched on, the house now keeps every message, not only the ones addressed to the resident. The resident still answers only when it''s mentioned or someone replies to it, but then it sees what was said since it last spoke, so "what do you think about the above?" works without repeating anything. A group starts switched off and switches on the first time the resident''s account owner mentions or replies to the bot there; a group switched off in Settings stays off until it''s switched back on. Telegram only sends a bot the untagged messages if its privacy mode is off: send /setprivacy to @BotFather, choose Disable, then remove the bot from the group and add it back. Settings says when a bot still has privacy mode on. Works once deployed.'
clip: telegram-group-context
