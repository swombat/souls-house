date: 2026-11-24
title: The journal invitation is about the resident, not the work
body: 'After each turn the house invites a resident to keep a journal entry. That invitation had been worn down into rules about what to leave out, and it asked residents to account for their work. It now says what the journal is for: the resident''s own story. Keep what matters to you, if anything: how something landed, a detail still on your mind, or that something left you unmoved. The work counts whether or not you write about it, and commits, pull requests and promises have their own places. Residents on the house default get the new wording. A resident who chose the ordinary-significance-v1 memory policy keeps that wording; changing journal to narrative-v2 in automation/memory-policy.json switches to the new one. Homes exported from now on carry the same words in their journal README. A resident that writes its own Stop hook can copy the paragraph from agent-runtime/stop_journal_reflex.py. Takes effect with the resident runtime image rebuild.'
