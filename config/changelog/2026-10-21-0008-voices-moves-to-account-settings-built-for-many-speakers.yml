date: 2026-10-21
title: Voices moves to Account settings, built for many speakers
body: Voices is now a tab in Account settings. Speakers are a compact list you can search or filter (Needs review, With samples, Name only, All), with a count of samples waiting for review on each. Pick one to see their fingerprint samples, one line each with play, accept and reject; Accept unlocks once you've heard the sample to the end. Namings that never produced a usable sample are folded into one line you can open. Samples learned before their source spans were recorded can't be played yet; one Prepare button, for a speaker or the whole account, rebuilds them from their recordings in the background, and they stay in the fingerprint, unconfirmed, until you review them. Works once deployed.
clip: voice-samples
