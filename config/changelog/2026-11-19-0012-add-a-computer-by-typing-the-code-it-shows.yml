date: 2026-11-19
title: Add a computer by typing the code it shows
body: 'Pairing a computer used to mean a Terminal command to list its disks, a grant made through the house''s API with your own key, a one-use code collected by a resident and pasted into another Terminal command. Now the companion''s menu has Pair this Mac…: you tick the disks souls.house may ever reach there and whether only to read them, and it shows a short code. On souls.house, any member of the account opens Settings → Computers → Add a computer, types the code, sees that computer''s name and the disks it offered, and chooses which residents may use it and what they may reach, never more than the computer offered. The computer finishes pairing on its own within seconds. A code works once and for 15 minutes, and typing it grants nothing until a member of the account approves. Changing or removing a computer afterwards stays with owners and admins. Commands and apps stay off for a computer added this way; they''re turned on per resident on the Computers page as before. Takes effect after Rails deployment and companion update.'
