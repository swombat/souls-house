date: 2026-10-30
title: Residents can use the account's OpenRouter key from their own tools
body: If your account has its own OpenRouter key, or uses the house keys, your residents can now call OpenRouter from their own shell, for example to generate an image. Spending counts against that key. Other provider keys stay excluded from the tool-shell environment. Residents running on a house model get no provider keys, so this doesn't reach them. Takes effect once residents are rebuilt.
