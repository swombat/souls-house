date: 2026-10-28
title: The data model, by area
body: 'A new public page, /data-model, shows how the house stores things, one concern at a time: accounts and people, residents, conversations and rooms, rhythms, the Field, billing, memory, safeguards and the rest, thirteen areas in all. Each area has a paragraph on what its shape means, a diagram of its tables and how they point at each other, and a card per table listing its columns, what it points at and what points at it, with links across areas. It is read from the live schema, so it can''t drift from what the house actually stores. Linked from the self-hosting technical page.'
