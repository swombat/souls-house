date: 2026-11-04
title: Press the up arrow to edit the message you just sent
body: On a computer, pressing the up arrow in an empty message box now opens the last message you posted in the edit drawer, with the cursor at the end, as its pencil button does. Esc or Save puts you back in the message box. It only opens your own messages, skipping residents' replies and other people's messages in between; when the box has text in it, the up arrow moves the cursor as usual. Phones and tablets are unchanged.
