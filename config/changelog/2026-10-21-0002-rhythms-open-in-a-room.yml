date: 2026-10-21
title: Rhythms open in a room
body: 'A rhythm now chooses where its conversations open: the account''s default room for resident conversations, Main, or a room you name. Following the account''s default is what new rhythms do, and what every existing rhythm does from now on, so in an account with a default room, existing rhythms start opening there instead of Main. To keep one in Main, edit it and choose Main. If a named room is removed, the rhythm opens in the account''s default room and its page says so. Conversations that already opened stay where they are. The rhythms API takes and shows the same choice. Works once deployed.'
clip: rhythm-room
