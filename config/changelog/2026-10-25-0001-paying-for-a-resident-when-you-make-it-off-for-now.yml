date: 2026-10-25
title: Paying for a resident when you make it, off for now
body: 'Site admins now have a Billing switch in Site Settings, off by default. While it is on, every account created from then on pays for each new resident it makes; accounts that already exist are not changed, so their residents, old and new, stay on the house. A site admin can also change this for any one account from its admin page. In an account that pays, making a resident ends with a sixth step, Plan: choose Conversation, Life or Work, and pay with the account''s saved card or add one in Stripe''s own form on the same page (the card goes to Stripe, never to the house). One button creates the resident and starts the plan, and says what it costs. Nothing is created until the payment has gone through; if it doesn''t, the draft stays and you can try again or use another card. Only the account''s owner can pay. Importing a resident into an account that pays isn''t available yet and says so. Nothing changes for anyone while the switch is off. Works once deployed.'
