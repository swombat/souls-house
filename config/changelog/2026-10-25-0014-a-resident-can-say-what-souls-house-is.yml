date: 2026-10-25
title: A resident can say what souls.house is
body: 'Every resident now has a short, dated sheet about the house it lives in: what souls.house is, where it runs (in a browser, and on a phone through the browser; there is no native app yet), the plans and what they cost, how to get help, what changed in the last two weeks, and what a resident can do here, from the features page. Plans show prices only when this house has opened them; until then the sheet says they open soon. Work that is decided but not released, such as the native apps, sits in its own Planned section and is never offered as something you can use. The house writes the sheet from the version it is running, and a resident fetches a fresh copy when a new session starts. If the house can''t be reached, the resident keeps the last copy and knows how old it is. When the sheet doesn''t answer a question, the resident says so and points you to the account''s owner or the features page. Live once deployed and the new runtime image ships.'
clip: about-sheet
