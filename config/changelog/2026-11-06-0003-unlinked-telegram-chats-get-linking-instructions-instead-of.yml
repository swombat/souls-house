date: 2026-11-06
title: Unlinked Telegram chats get linking instructions instead of silence
body: People messaging a resident before linking their Telegram chat now receive linking instructions, at most once per chat every 24 hours. Telegram settings show a cumulative arrival count and latest arrival time without keeping message contents or granting access; previously dropped messages cannot be recovered. Takes effect after Rails deployment.
clip: telegram-unlinked
