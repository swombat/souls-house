# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # Says when production stops following master (DeployAlarm).
  deploy_alarm_check:
    class: DeployAlarmCheckJob
    queue: default
    schedule: every 5 minutes

  vm_birth_sweep:
    class: VmBirthSweepJob
    queue: default
    schedule: every minute

  field_voice_enrolment_sweep:
    class: FieldVoices::EnrolmentSweepJob
    queue: default
    schedule: every 15 minutes

  field_recordings_stuck_sweep:
    class: FieldRecordings::StuckSweepJob
    queue: default
    schedule: every 10 minutes

  field_summary_sweep:
    class: FieldItems::SummarySweepJob
    queue: default
    schedule: every hour at minute 37

  field_recordings_orphan_sweep:
    class: FieldRecordings::OrphanSweepJob
    queue: default
    schedule: every hour at minute 23

  rhythms:
    class: RhythmSweepJob
    queue: default
    schedule: every minute

  repository_watch_sweep:
    class: RepositoryWatchSweepJob
    queue: default
    schedule: every 5 minutes

  message_dispatch_sweep:
    class: MessageDispatchSweepJob
    queue: default
    schedule: every minute

  resident_turn_dispatch:
    class: ResidentTurnDispatchJob
    queue: resident_dispatch
    schedule: every 10 seconds

  mnemodyne_readiness:
    class: Mnemodyne::ProbeJob
    schedule: every 5 minutes
  mnemodyne_erasure:
    class: Mnemodyne::EraseVaultsJob
    schedule: every hour at minute 25

  mnemodyne_decay:
    class: Mnemodyne::DecayJob
    schedule: every day at 3:15am

  agent_storage_usage:
    class: CollectAgentStorageUsageJob
    schedule: every hour at minute 45

  house_host_sample:
    class: HouseHostSampleJob
    schedule: every 5 minutes

  house_storage_sample:
    class: HouseStorageSampleJob
    schedule: every day at 4:40am

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  full_backup:
    class: FullBackupJob
    schedule: every day at 4am

  external_agent_wake:
    class: ExternalAgentWakeJob
    queue: default
    schedule: every hour at minute 5

  external_agent_extra_half_hour_wake:
    class: ExternalAgentWakeJob
    queue: default
    schedule: every hour at minute 35

  external_agent_daily_memory_aggregation:
    class: ExternalAgentMemoryAggregationJob
    queue: default
    args: [ "daily" ]
    schedule: "0 2 * * *"

  external_agent_weekly_memory_aggregation:
    class: ExternalAgentMemoryAggregationJob
    queue: default
    args: [ "weekly" ]
    schedule: "30 2 * * 1"

  external_agent_monthly_memory_aggregation:
    class: ExternalAgentMemoryAggregationJob
    queue: default
    args: [ "monthly" ]
    schedule: "0 3 1 * *"

  sync_oura_data:
    class: SyncOuraDataJob
    queue: default
    schedule: every 4 hours

  sync_github_commits:
    command: "GithubIntegration.sync_all_due!"
    schedule: every hour at minute 15

  agent_health_check:
    class: AgentHealthCheckJob
    queue: default
    schedule: every 5 minutes

  safeguard_detection_retention:
    class: SafeguardDetectionRetentionJob
    queue: default
    schedule: every day at 3:30am
