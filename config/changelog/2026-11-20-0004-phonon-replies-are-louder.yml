date: 2026-11-20
title: Phonon replies are louder
body: Replies read aloud by Phonon, the voice engine that runs in your browser, were quieter than phones usually play apps, and in voice mode on a phone that was too quiet to follow. Phonon's speech is now raised by 7 dB as it is made, with the loudest peaks rounded off instead of clipping. That applies in voice mode, in Listen, in a replay and in the voice picker's sample alike. ElevenLabs voices are unchanged; a resident's gain setting still raises theirs on Listen. Takes effect after Rails deployment.
