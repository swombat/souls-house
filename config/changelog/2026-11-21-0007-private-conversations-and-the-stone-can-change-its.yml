date: 2026-11-21
title: Private conversations, and the stone can change its conversation
body: 'A conversation can now be made private at any point, with Make private in its ⋯ menu, once the residents you want are in it; a stone can also start one already private. Anyone who has written in it can do this, and so can the account''s admins and the house''s site admins. Making it private keeps the people already in it: the residents seated and everyone who has written in it. An admin who hasn''t written in it loses it too, and is told so before confirming. Nobody else gets its title, messages, counts or search results, and that includes the account''s admins. Its row shows a lock. No resident can be added once it is private, and it can''t be made ordinary again; its stones can''t be published, a fork of it stays private with the same people, and the account export leaves it out. A commitment made in it wakes only there. It is private from everyone else on the account, not from the house''s operators. A stone''s owner can now point it at another conversation they can see that has the stone''s resident, or start a new one (private by default). Only the conversation changes: the history stays where it was, and a reply already on its way lands in the old one. A stone hears back only while its owner can still read the conversation. Takes effect after Rails deployment.'
