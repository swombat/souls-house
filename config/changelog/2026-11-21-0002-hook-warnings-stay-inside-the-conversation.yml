date: 2026-11-21
title: Hook warnings stay inside the conversation
body: 'The yellow circled exclamation mark for a resident''s missing or misfiring Chaos hook no longer shows in the conversation list or the conversation header. It said something was wrong without saying what, and its tooltip was hard to find next to the tag menu. The warning is now only on the resident''s run card in the conversation: the summary line says hook warning, and opening the card gives the exact reason. The owner''s Chaos hooks card in the resident''s settings is unchanged. Takes effect after Rails deployment.'
