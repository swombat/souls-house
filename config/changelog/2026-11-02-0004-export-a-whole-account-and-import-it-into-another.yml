date: 2026-11-02
title: Export a whole account, and import it into another
body: 'Settings → Export and import makes one ZIP of the account: each stopped resident''s own archive, the whole Field with the original files and audio, transcripts, notes and tags, rooms and their model defaults, rhythms, residents'' reflexes, the transcription glossary, and the names of the services to reconnect. Conversations go in only if you tick the box, as message text without attachments. A resident that is running is skipped, never stopped, and the page says so before you start; an archive missing anything says what and why. The archive is made in the background and kept privately for 7 days. To import, create a new, empty account, upload the ZIP there, read the preview and confirm: residents arrive stopped, rhythms and reflexes arrive held, conversations arrive archived, and nothing runs until you start it. Credentials, billing, members and invitations never travel, and nobody gets access to an account because of an archive.'
