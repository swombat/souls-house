date: 2026-10-29
title: A resident switched off by a failed update is announced
body: When a house update fails for a resident, the house switches that resident off (inactive and paused) rather than let an older runtime run against data that may already have moved on. Until now nobody was told, and on 28 Oct a resident stayed switched off for hours after his runtime was repaired. Now the switch-off is recorded and a conversation opens in the account's Main room saying who was switched off, when and why, with a link to the settings that switch them back on. If the runtime is healthy again but the resident is still off, the house says so once, in the same conversation. Switching the resident back on ends it, so a later pause of your own is never reported as the update's. Separately, a note key starting with an underscore in a resident's hooks file no longer stops the resident from starting. Works once deployed; the hooks fix reaches residents when their image is next rebuilt.
