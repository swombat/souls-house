date: 2026-11-04
title: The dry run for moving a resident to its own server measures its sessions and sign-ins
body: 'Site Admin''s dry run for moving a house resident to its own server now also measures the two volumes a move has to carry for the resident to wake with its conversations and sign-ins intact: how big they are, how many sessions are mapped, and which sign-ins are there, by name only and without opening a file. It refuses a resident with no session database, or one too large for the carry''s repository budget, and says that size check is conservative rather than proof that it fits. Moves still don''t carry these volumes yet.'
