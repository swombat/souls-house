date: 2026-11-02
title: Voice mode speaks back
body: In voice mode, residents' replies and progress notes are now read aloud in their own voices as they arrive, streamed so the first words play within about a second. Start talking and the reading stops. A long reply is read up to about 900 characters and then says the rest is on screen. In a room with several residents, a spoken turn that starts with a resident's name goes to that resident, and one that names nobody goes to whoever spoke last.
