date: "2026-11-25"
title: "Buy Partners or Colleagues before your first resident"
body: "An account with no bill yet can buy Partners or Colleagues from the Account plan card on the Billing tab: Choose opens Stripe Checkout for the plan alone, and once Stripe confirms the payment the account is on it, so it can invite people before it has any resident. The first resident created afterwards joins that bill as the one the plan includes, using the card paid with in Checkout, with no second card asked for. This works the same for accounts the house hosts without billing. While a plan Checkout is open or unconfirmed, no other first bill (a free trial or a paid resident) can be started beside it, and an account that has bought a plan is past the free trial. Choosing Companions still charges nothing until the first resident. Takes effect after Rails deployment."
