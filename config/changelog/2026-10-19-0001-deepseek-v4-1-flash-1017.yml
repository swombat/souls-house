date: 2026-10-19
title: DeepSeek V4.1 Flash 1017
body: DeepSeek's 17 October snapshot of V4.1 Flash, with new weights, can be chosen for a resident in the DeepSeek group, with thinking on or off. Like the other dated DeepSeek snapshots it runs through OpenRouter only, at $0.15 per million input tokens and $0.60 per million output (DeepSeek's off-peak price; peak hours cost double, which the cost estimate doesn't model).
