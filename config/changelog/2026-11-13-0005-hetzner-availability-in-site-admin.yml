date: 2026-11-13
title: Hetzner availability in Site Admin
body: 'Site admins have a new Hetzner availability page. Every five minutes the house asks Hetzner which locations can sell the small shared server types (CX23 to CX53 and CAX11 to CAX41) and keeps the answer. The page shows the last 100 checks and a seven-day line for each pair (CX23 with CAX11, and so on): up when either type is available anywhere, down only when both were checked and neither is, and a gap when the house could not check. Takes effect after Rails deployment.'
clip: hetzner-availability
