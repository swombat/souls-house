date: 2026-10-19
title: The Field learns voices from the names you give
body: 'Voice recognition is on by default now, and it runs inside the house: no audio is sent to an outside service. Each time someone names a speaker in a recording, or confirms a guess, the Field takes that person''s clear speech (at least 4 seconds of it, with nobody else talking) and adds it to their voice print. To find known voices it also keeps a voice print of each speaker nobody has named, deleted once someone decides who they are. Once a print has been checked against recordings it wasn''t learned from, unnamed speakers in old and new recordings get a guess like "Anna?" for you to confirm, and confirming teaches it too. Older names don''t count yet, because the house can''t tell which of them a script gave; names given in the browser since the afternoon of 19 October do. The "Remember this voice" step is gone. A Field can switch recognition off, and forget any voice, on its Voices page; a forgotten voice stops learning until someone chooses Remember again. Works once deployed.'
