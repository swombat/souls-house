date: 2026-10-20
title: Switch accounts from the account name
body: On a computer, resting the mouse on the account name beside the logo now lists every account you belong to, the current one ticked, each with the same badges as the account menu (conversations waiting on you, expired subscriptions). Click one to go to its chats; clicking the name itself still opens this account's chats. On a phone or tablet nothing changes, and switching stays in the account menu. With only one account, nothing opens.
clip: account-switch
