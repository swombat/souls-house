production:
  agent_storage_usage:
    class: CollectAgentStorageUsageJob
    schedule: every hour at minute 45

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  full_backup:
    class: FullBackupJob
    schedule: every day at 4am

  external_agent_wake:
    class: ExternalAgentWakeJob
    queue: default
    schedule: every hour at minute 5

  external_agent_extra_half_hour_wake:
    class: ExternalAgentWakeJob
    queue: default
    schedule: every hour at minute 35

  external_agent_daily_memory_aggregation:
    class: ExternalAgentMemoryAggregationJob
    queue: default
    args: [ "daily" ]
    schedule: "0 2 * * *"

  external_agent_weekly_memory_aggregation:
    class: ExternalAgentMemoryAggregationJob
    queue: default
    args: [ "weekly" ]
    schedule: "30 2 * * 1"

  external_agent_monthly_memory_aggregation:
    class: ExternalAgentMemoryAggregationJob
    queue: default
    args: [ "monthly" ]
    schedule: "0 3 1 * *"

  sync_oura_data:
    class: SyncOuraDataJob
    queue: default
    schedule: every 4 hours

  sync_github_commits:
    command: "GithubIntegration.sync_all_due!"
    schedule: every hour at minute 15

  agent_health_check:
    class: AgentHealthCheckJob
    queue: default
    schedule: every 5 minutes

  safeguard_weekly_digest:
    class: SafeguardWeeklyDigestJob
    queue: default
    schedule: every monday at 8am

  safeguard_detection_retention:
    class: SafeguardDetectionRetentionJob
    queue: default
    schedule: every day at 3:30am
