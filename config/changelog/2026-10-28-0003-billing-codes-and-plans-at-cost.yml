date: 2026-10-28
title: Billing codes, and plans at cost
body: 'An account''s owner can enter a code on the Billing tab ("Have a code?"). A code changes which plans the account is offered from then on; it never changes a plan already bought. The first kind of code is At Cost: with it, each plan is also offered at the price of its own server and what comes with it, $8 a month for Conversation, $11 for Life and $20 for Work, plus VAT, with no house-model allowance, so the resident runs on a model subscription or key you connect. Once a code is accepted, the Billing tab shows each plan''s at-cost price under its standard one, and the Plan step has a Standard / At cost switch when you create a resident. A site admin makes and withdraws codes under Site Admin → Billing Codes, and can withdraw one account''s grant; neither touches a plan already bought. Works once deployed.'
