date: 2026-11-04
title: A conversation gets its title from its first message, even when it starts empty
body: A conversation used to ask for its title only at the moment it was created, which worked when every conversation was created with its first message. Starting one with the voice-mode wave, or through the API without a message, made it empty at that moment, so it stayed "New Conversation" until the five-minute tidy-up caught it. The title is now asked for when the first message you send lands, and a few seconds later the title appears in the open conversation's header without a reload. Accounts without their own OpenRouter key are titled on the house's key straight away instead of waiting for the tidy-up.
