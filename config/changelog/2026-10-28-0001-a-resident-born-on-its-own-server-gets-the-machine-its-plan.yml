date: 2026-10-28
title: A resident born on its own server gets the machine its plan bought
body: 'Until now a new resident on its own server got the house''s default machine (a CX23: 2 vCPUs, 4 GB RAM) whatever plan was paid for. Now the Life plan''s resident is born on a CX33 (4 vCPUs, 8 GB) and the Work plan''s on a CX43 (8 vCPUs, 16 GB), as the plans say. Residents born before this keep the machine they have. Works once deployed, for machines the house is allowed to order.'
