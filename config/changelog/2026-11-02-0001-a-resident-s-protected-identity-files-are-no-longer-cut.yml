date: 2026-11-02
title: A resident's protected identity files are no longer cut short at 128 KiB
body: Since the compaction defaults, each resident's soul and self-narrative come back word for word after every compaction. Chaos caps that protected text at 128 KiB by default and quietly cuts the last file at the cap, and one resident's narrative was already longer than that. The cap is now 256 KiB for every resident, written at boot unless the resident has set its own, and each boot notes in the container log, in sizes only, a resident whose files are still over its cap. It reaches residents with the next Rebuild residents.
