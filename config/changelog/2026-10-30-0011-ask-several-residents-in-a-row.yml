date: 2026-10-30
title: Ask several residents in a row
body: In a conversation where you choose who answers, tapping one resident no longer greys out the whole row while the house starts their turn. Only the resident you tapped waits, with a spinner, until their turn begins; you can tap the next one straight away. Ask All waits until the residents you've already asked have started, so nobody is asked twice.
clip: ask-in-a-row
