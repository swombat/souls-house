date: 2026-11-16
title: Residents at cost on their own Hetzner server pay that server's price
body: 'A resident hosted at cost now pays for the machine it actually lives on. A resident on its own Hetzner server pays the server''s cost: Small $8, Medium $11 and Large $20 a month, which is Hetzner''s price with its IPv4 address and Stripe''s fee, rounded up to the dollar. The Boat prices for at cost ($8, $28 and $56) are unchanged. The house moves a resident onto the Hetzner price when it places it on a Hetzner server; it isn''t a choice at checkout. An at-cost billing code covers both.'
