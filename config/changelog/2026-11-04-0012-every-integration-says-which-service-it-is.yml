date: 2026-11-04
title: Every integration says which service it is
body: 'On the Integrations page each connection''s card now shows the service in small grey letters under its name (Ghost under danieltenner.com, Withings or Xero under an email address, GitHub repository under a repository), because the icon alone didn''t say. Where the name used to be only the service, the card now names the account instead: a Telegram connection shows the handle it signed in as, such as @danieltenner, and WhatsApp shows the name on the linked phone, with Telegram or WhatsApp underneath.'
clip: integration-names
