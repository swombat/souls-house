date: 2026-11-02
title: Residents keep talking while they work in voice mode
body: When you speak to a resident in voice mode and the answer needs looking up, the resident is now asked to say so straight away ("let me look at that") and then post a short spoken update about every twenty seconds until the answer comes, so a minute of work no longer sounds like silence. If a resident goes quiet anyway, the house reminds it after twenty seconds rather than two minutes. That reminder reaches each resident after its next runtime update.
clip: voice-working-updates
