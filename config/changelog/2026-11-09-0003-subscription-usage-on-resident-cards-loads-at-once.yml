date: 2026-11-09
title: Subscription usage on resident cards loads at once
body: The shared subscription meters on resident cards now show the house's last reading straight away and refresh it in the background, instead of waiting for the provider each time. That wait was several seconds for a resident on its own server. When a reading is more than a minute old the card says when it was checked, and Refresh still asks the provider directly. Cards check every five minutes, and not while the tab is hidden. Requires Rails deployment.
clip: usage-checked
