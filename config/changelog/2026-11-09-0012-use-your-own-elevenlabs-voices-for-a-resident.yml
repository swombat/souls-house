date: 2026-11-09
title: Use your own ElevenLabs voices for a resident
body: 'An account that speaks with ElevenLabs on its own key can now give a resident any voice from its own ElevenLabs library: a voice you cloned, designed, or added from ElevenLabs'' voice library. The Appearance tab''s voice picker lists them as "Your ElevenLabs voices" above the standard ones, Preview plays them through your key, and a resident can choose one itself with soulshouse-voice. These were left out before because they would have spoken on the house''s key; speech now runs on the account''s own key, so which of its voices to use is the account''s choice. The list is read with your key and never shown to another account. Takes effect after Rails deployment; the resident helper after a runtime rebuild.'
