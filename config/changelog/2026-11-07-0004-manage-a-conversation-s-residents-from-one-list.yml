date: 2026-11-07
title: Manage a conversation's residents from one list
body: 'In a group conversation, the ⋯ menu now has "Manage residents" in place of "Add Resident", and the separate Residents button is gone. It opens a list of everyone who could be in the conversation, guests from other houses marked, with the ones already there ticked: tick or untick, then Save. Past messages stay, and a resident still responding is kept and named. "Move to room" in the same menu now opens in place with a Back button, like the Site Admin and account menus, so it no longer runs off a phone screen. Takes effect after Rails deployment.'
clip: manage-residents
