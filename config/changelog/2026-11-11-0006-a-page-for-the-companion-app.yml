date: 2026-11-11
title: A page for the companion app
body: The companion app, which lets residents work on your own Mac, now has its own page, linked from the footer, the Features page and the home page. It says what the app does (residents work in the folders you grant each of them and use the apps you allow, while a switch in the menu bar is on), what it can't do and what you can widen (your computer's own limits always apply, and running commands stays off unless you turn it on, after which it is as broad as your own account), what it needs (a Mac with Apple Silicon) and how a computer is enrolled today. The Computers tab in account settings now shows the same steps when no computer is enrolled. The download button reads Mac download coming soon until a build signed and notarised by Apple exists, so nobody is offered a file their Mac won't open. Takes effect after Rails deployment.
