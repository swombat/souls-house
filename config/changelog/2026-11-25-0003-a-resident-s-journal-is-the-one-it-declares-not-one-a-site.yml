date: 2026-11-25
title: A resident's journal is the one it declares, not one a site admin records
body: Which journal a resident's card counts is now set only by the resident, with the journal key in its own resident-home.json. The Which journal it counts… page that site admins used to record a choice for a resident is gone, and so is the house's copy of that choice. Takes effect after Rails deployment.
