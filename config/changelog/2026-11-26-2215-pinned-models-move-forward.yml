date: "2026-11-26"
title: "A pinned model that leaves a resident's list moves to its successor"
body: "When a conversation or a rhythm has a resident pinned to a model that is no longer on that resident's list, the house now moves the pin forward to the nearest newer model of the same line that the list carries, such as GPT-6.1 Sol to GPT-6.2 Sol, instead of refusing every run. It happens when that conversation next runs, and the conversation gets one line saying what moved and why; for a rhythm, the rhythm's own setting moves too, so the next occurrence starts on the new model. It never moves backwards, never to another provider, and never to a model nobody recorded as the successor: when there is no successor on the list, the pin stays and the run is refused visibly, as before, and for a rhythm the account's owner is emailed once. A room's model default is left as it was set, and new conversations in that room start on its successor. Choosing a model from the resident's button still wins. Takes effect after Rails deployment."
