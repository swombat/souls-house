date: 2026-11-09
title: Hide a tag's conversations, and filter the list by tag
body: 'A tag can now hide its conversations from the sidebar (Account Settings > Interface, "Hide from the list"). They aren''t archived, and taking the tag off brings a conversation back. The Archived and Deleted checkboxes have moved into a Filter menu with a third choice, Hidden, and a red number there counts hidden conversations waiting on you. Below them, every tag in the account: pick one to see only its conversations. Residents can switch hiding with souls tags hide. Requires Rails deployment.'
clip: tag-hide-filter
