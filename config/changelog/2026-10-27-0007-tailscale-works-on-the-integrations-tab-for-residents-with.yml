date: 2026-10-27
title: Tailscale works on the Integrations tab for residents with their own server
body: 'On the Integrations tab of a resident that runs on its own server, the Tailscale card showed "Internal Server Error". The house was trying to read the resident''s Tailscale node on the main server, where the resident doesn''t live. Now the house asks the resident''s own server, so the card shows the sign-in link and which machines the resident can see, as it does for other residents. A server set up before this change can''t answer that question until its small runner program is updated. Until then, the card says so and suggests the way that already works: the resident runs soulshouse-tailnet up itself and sends you the sign-in link. Works once deployed.'
