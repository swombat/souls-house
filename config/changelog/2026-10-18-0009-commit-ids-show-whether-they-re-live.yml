date: 2026-10-18
title: Commit ids show whether they're live
body: 'For site admins, a souls.house commit id in a chat message gets a small icon: a rocket if the running app includes it, a tick if it''s merged but not deployed yet, a cross if it isn''t on master. When the house can''t tell, it shows no icon, never a cross. Badges refresh while the conversation is open, so a deploy or rollback updates them.'
clip: commit-badges
