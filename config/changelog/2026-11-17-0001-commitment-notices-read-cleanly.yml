date: 2026-11-17
title: Commitment notices read cleanly
body: 'The line a conversation gets when a resident makes a commitment no longer shows stray asterisks, and the due date is set apart from the summary instead of running into it. It reads, for example: Mira made a commitment: Check the deploy status · due Tue 10 Nov 03:00 Europe/Madrid. Takes effect after Rails deployment.'
clip: commitment-clean
