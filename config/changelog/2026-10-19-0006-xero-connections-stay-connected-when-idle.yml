date: 2026-10-19
title: Xero connections stay connected when idle
body: Xero drops a connection that goes 60 days without refreshing. Once a day the house now refreshes any Xero connection that hasn't refreshed for 30 days, so one nobody uses for a while doesn't lapse. If Xero refuses a connection outright, its card under Integrations says "Reconnect needed" and Connect puts it back, instead of residents finding out from an error. Works once deployed.
