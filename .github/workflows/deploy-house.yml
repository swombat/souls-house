name: Host deployment transport
# Same-repository callers must inherit secrets for environment-secret resolution
# (actions/runner#4453). The master-only environment remains the key boundary.

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      # Optional, Rails only: deploy only if master is still this commit. The
      # host checks it against its own clone; it can't pick another commit.
      expected_revision:
        required: false
        type: string
        default: ''
      # Chaos/both only: upstream migration changes the owner has reviewed, as
      # the "migration_changes" entries a refused run printed (path@blob,...).
      accept_migrations:
        required: false
        type: string
        default: ''
      # Clear the latch left by this exact failed/interrupted host job first.
      acknowledge_failed_job:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    # actor is the original caller; triggering_actor is the person requesting
    # this attempt, including reruns. Require both before attaching secrets.
    if: github.ref == 'refs/heads/master' && github.actor == 'swombat' && github.triggering_actor == 'swombat'
    # Only authorized jobs may enter the queue; rejected callers must not
    # displace an owner's pending deployment.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # IMPORTANT: configure this environment's branch policy to master only.
    # Environment policy is the branch boundary; the if is the actor boundary.
    # Both depend on reviewed, protected master workflow code.
    environment: production-deploy
    env:
      OPERATION: ${{ inputs.operation }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      ACCEPT_MIGRATIONS: ${{ inputs.accept_migrations }}
      ACKNOWLEDGE_JOB: ${{ inputs.acknowledge_failed_job }}
      DEPLOY_HOST: ${{ vars.HOUSE_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.HOUSE_DEPLOY_PORT }}
    steps:
      - name: Request deployment and wait for verified outcome
        id: request
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOUSE_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOUSE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?Deployment environment SSH key unavailable}"
          : "${DEPLOY_KNOWN_HOSTS:?Deployment environment host keys unavailable}"
          case "$OPERATION" in rails|chaos|both|runtime) ;; *) exit 2;; esac
          request="$OPERATION"
          if [[ -n "$EXPECTED_REVISION" ]]; then
            [[ "$OPERATION" == rails && "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 2
            request="rails expect $EXPECTED_REVISION"
          fi
          ACCEPT_MIGRATIONS="$(tr -d ' \n\r\t' <<<"$ACCEPT_MIGRATIONS")"
          if [[ -n "$ACCEPT_MIGRATIONS" ]]; then
            [[ "$OPERATION" == chaos || "$OPERATION" == both ]] || { echo 'accept_migrations is for Chaos updates only'; exit 2; }
            [[ "$ACCEPT_MIGRATIONS" =~ ^[A-Za-z0-9_./,@-]+$ ]] || { echo 'accept_migrations must be path@blob entries separated by commas'; exit 2; }
            request="$OPERATION accept $ACCEPT_MIGRATIONS"
          fi
          if [[ -n "$ACKNOWLEDGE_JOB" ]]; then
            [[ "$ACKNOWLEDGE_JOB" =~ ^[0-9a-f]{32}$ ]] || { echo 'acknowledge_failed_job must be a 32-character host job id'; exit 2; }
          fi
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          umask 077
          directory="$(mktemp -d)"
          trap 'rm -rf "$directory"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$directory/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$directory/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          remote() {
            ssh -i "$directory/key" -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$directory/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "house-deploy-trigger@$DEPLOY_HOST" "$1"
          }
          if [[ -n "$ACKNOWLEDGE_JOB" ]]; then
            # Assigned on its own line so a host refusal stops the run (set -e);
            # inside printf's arguments the failure would be swallowed.
            acknowledged="$(remote "acknowledge $ACKNOWLEDGE_JOB")"
            printf 'Acknowledged: %s\n' "$acknowledged"
          fi
          receipt="$(remote "$request")"
          printf '%s\n' "$receipt"
          id="$(jq -er '.id' <<<"$receipt")"
          [[ "$id" =~ ^[0-9a-f]{32}$ ]]
          echo "Host job: $id" >> "$GITHUB_STEP_SUMMARY"
          previous=""
          for ((attempt=0; attempt<900; attempt++)); do
            receipt="$(remote "status $id")"
            if [[ "$receipt" != "$previous" ]]; then
              printf '%s\n' "$receipt"
              previous="$receipt"
            fi
            state="$(jq -er '.state' <<<"$receipt")"
            case "$state" in
              success)
                if [[ -n "$EXPECTED_REVISION" ]]; then
                  [[ "$(jq -er '.rails_revision' <<<"$receipt")" == "$EXPECTED_REVISION" ]] || {
                    echo 'Host deployed a different revision than expected'; exit 1; }
                fi
                printf '\nVerified:\n```json\n%s\n```\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
                echo outcome=deployed >> "$GITHUB_OUTPUT"
                exit 0 ;;
              superseded)
                printf '\nMaster moved on; nothing deployed:\n```json\n%s\n```\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
                echo outcome=superseded >> "$GITHUB_OUTPUT"
                # Red in Actions: GitHub success with nothing shipped is the
                # hole in #313. The host still deploys nothing; the marker
                # step below still names this as superseded, not a crash.
                exit 1 ;;
              failed|partial|interrupted)
                printf '\nNot complete:\n```json\n%s\n```\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
                if changes="$(jq -er '.migration_changes // empty | join(",")' <<<"$receipt")"; then
                  printf '\nUpstream changed migrations residents already applied. After review, rerun Update Chaos with\n- acknowledge_failed_job: `%s`\n- accept_migrations: `%s`\n' "$id" "$changes" >> "$GITHUB_STEP_SUMMARY"
                fi
                exit 1 ;;
              starting|running) sleep 20 ;;
              *) echo 'Unknown host state'; exit 1 ;;
            esac
          done
          echo "Wait expired; job $id may still be running on the host. Inspect before retrying."
          exit 1
      # Marker steps: the Deployments page reads which of these ran. A real
      # deploy leaves the job green. Superseded is red (nothing shipped) and
      # still named, so it is not confused with a host crash.
      - name: Deployment verified
        if: steps.request.outputs.outcome == 'deployed'
        run: echo deployed
      - name: Master moved on, nothing deployed
        if: failure() && steps.request.outputs.outcome == 'superseded'
        run: echo superseded
