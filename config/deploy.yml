# config/deploy.yml

service: souls-house
image: dtenner/souls-house

registry:
  username: dtenner
  password:
  - KAMAL_REGISTRY_PASSWORD

ssh:
  user: swombat
  port: 12222 # This is the SSH port for your server

env:
  clear:
    RAILS_SERVE_STATIC_FILES: true # Let Rails serve static files (since no external proxy in production)
    RAILS_LOG_TO_STDOUT: true # Log to STDOUT for Docker logging
    RAILS_ENV: production
    SOULSHOUSE_AGENTS_NETWORK: kamal # Agent containers join Kamal's private Docker network.
    SOULSHOUSE_AGENT_IMAGE_DEFAULT: helixkit-agent-runtime:latest
    SOULSHOUSE_AGENT_INTERNAL_URL: http://souls-house-web:3000 # Agent callbacks hit Rails over Docker DNS.
    SOULSHOUSE_SANDBOX_HOST: 95.217.118.47 # Stored on promoted agents for operator diagnostics.
    SOULSHOUSE_AGENT_BACKUPS_ENABLED: true # Back up all hosted-agent persistent volumes during the nightly full backup.
  secret:
    - RAILS_MASTER_KEY # Rails master key (provide in .kamal/secrets)
    - DATABASE_URL # Database connection string (provided per env in secrets)

servers:
  web:
    hosts:
      - 95.217.118.47
    options:
      volume: /var/run/docker.sock:/var/run/docker.sock
      group-add: 988 # Host docker group; lets the non-root rails user use the mounted socket.
      network-alias:
        - souls-house-web
        - helix-kit-web # transition alias: pre-rename agent containers have the old callback URL baked in; remove in Step 2.5
  jobs:
    hosts:
      - 95.217.118.47
    cmd: "./bin/rails solid_queue:start"
    options:
      volume: /var/run/docker.sock:/var/run/docker.sock
      group-add: 988 # Host docker group; needed for PromoteAgentJob to spawn agent containers.

proxy:
  ssl: true
  hosts:
    - souls.house
  app_port: 3000
  response_timeout: 120

builder:
  arch: amd64
  remote: ssh://swombat@95.217.118.47:12222
  args:
    RAILS_ENV: production
  cache:
    type: registry
    options: mode=max
    image: dtenner/souls-house:production-build-cache

accessories:
  postgres:
    image: postgres:16.2 # Use the correct version for your app
    host: 95.217.118.47
    env:
      clear:
        # initdb-only vars — the existing data volume (renamed cluster) ignores them; kept in sync for clarity
        POSTGRES_USER: souls_house
        POSTGRES_DB: souls_house_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data # Persist db data on host (named volume "data")
