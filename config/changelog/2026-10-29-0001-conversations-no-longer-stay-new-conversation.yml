date: 2026-10-29
title: Conversations no longer stay "New Conversation"
body: The house names each conversation once, just after it starts, using the account's own OpenRouter key. On accounts with no OpenRouter key, or with a key that can't reach the naming model, that did nothing and the conversation kept the name "New Conversation" for good. Now every five minutes the house looks for conversations more than five minutes old that still have no name and asks again on its own key, with a model from a different family (Claude Haiku today). It tries each conversation at most three times. Conversations that are already stuck get named in the first runs after it's deployed. The house pays for these names. Works once deployed.
