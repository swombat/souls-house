date: 2026-10-30
title: A Telegram group's page now says what is actually kept
body: 'The page for a resident''s Telegram group used to say that only the messages mentioning or replying to the resident were copied to the house. Since the group feature started keeping the conversation around them too (so the resident can follow what it''s asked about), that line was wrong. It now says what is kept, from when, and each kept message is marked: addressed to the resident, context, or the resident''s reply. If the bot''s Telegram privacy mode is on, the page says so and explains that Telegram then limits which messages reach the bot, so ordinary unaddressed conversation may be missing from the copy. Works once deployed.'
clip: telegram-group-kept
