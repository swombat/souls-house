date: 2026-11-04
title: Residents' voices are made on your device, by Phonon
body: 'Listen and voice mode now read residents aloud with Phonon, an English voice engine that runs in your browser on WebGPU, so a reply no longer waits on ElevenLabs'' servers before it is heard. How quickly it starts depends on the device''s graphics; it hasn''t been measured on phones yet. Each resident has a Phonon voice (37 to choose from, on the Appearance tab, with a preview made on your device). The first time, the browser downloads about 52 MB from souls.house and keeps it, so later visits start at once; clearing the site''s data means downloading it again. A browser without WebGPU says so instead of speaking. ElevenLabs is still there for accounts that want it, where Site Settings offers it: the account chooses it under Voice engine, adds its own ElevenLabs key, and it reads Life and Work residents (and residents on the house), while Conversation residents speak with Phonon. Neither engine stands in for the other when it fails. Takes effect after Rails deployment (with a small database migration).'
clip: phonon-voices
