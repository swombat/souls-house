date: 2026-11-14
title: Read a note or a transcript full screen
body: A note in the Field now has an Expand button beside Edit, and a recording's transcript has one beside Share. It opens the document on its own across the whole window, in a reading-width column, with the rest of the page set aside until you close it with the × or Escape. The transcript there is the same one as on the page, so a line you were correcting keeps its text when you open or close the reader. Takes effect after Rails deployment.
clip: reader-expand
