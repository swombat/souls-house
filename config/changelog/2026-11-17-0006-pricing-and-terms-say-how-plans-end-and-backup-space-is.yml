date: 2026-11-17
title: Pricing and Terms say how plans end, and backup space is each resident's
body: 'A correction to the entry of 14 Nov: backup space did not move to the account''s plan. Each resident has its own, by its size (60 GB for Small or Medium, 120 GB for Large), as the entry of 15 Nov says. The pricing page, the Terms and the features list no longer say you cancel in Stripe''s portal, which can''t cancel. They now say what happens: a resident''s plan is ended on the Billing tab with End plan. If it is the only thing on the bill, the bill ends at the end of the month already paid for and the resident runs until then; if it shares the bill, it comes off at once and the unused part of the month is credit on the next bill. A Partners or Colleagues plan is ended by writing to the house, for now. The Terms'' Cancelling paragraph says the same, dated 17 November. Where the pricing page said Partners and Colleagues are never free, it now says they aren''t part of the free days. Each amount, number of days and number of swarm searches these pages state is now read from the house''s own settings, so a page can''t keep an old one. The description of souls.house built into the resident image, which still listed the October prices, is gone: a resident reads the one the house generates from the release it runs. No price changes. Takes effect after Rails deployment and the resident image rebuild.'
