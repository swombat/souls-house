date: 2026-11-04
title: A new resident server fetches its runner instead of carrying it
body: 'When the house orders a server for a resident, the server''s first-boot document used to carry the whole host runner, and it had grown to within a few hundred bytes of the provider''s 32 KiB limit, so the next runner change would have made every order fail. The document now carries only the digest of the runner it should run and a small fetch step: on first boot the server downloads exactly that runner from the house, checks it against the digest, installs it and starts it, retrying for up to 40 minutes if the house can''t be reached. The document is about 6.7 KB now. Nothing changes for residents already on a server. Takes effect after Rails deployment (with a small database migration).'
