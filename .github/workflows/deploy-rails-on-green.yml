name: Deploy Rails on green CI
# The tested commit is in the run name, so the Deployments page can show it.
run-name: Deploy Rails ${{ github.event.workflow_run.head_sha }}
# A merge to master is a decision to put it live. When CI passes for a push to
# master, deploy Rails. If the host says that commit changes the resident
# image (agent-runtime/), rebuild residents next: each is rolled only when
# idle, so nobody is cut off mid-turn. Chaos updates stay manual (Update
# Chaos / Deploy both): a new Chaos release is where its migrations are
# reviewed.
#
# Off switch: set the repository variable AUTO_DEPLOY_RAILS to "false".
#
# The request carries the commit CI tested. The host deploys master as it
# clones it, and only if that clone is exactly the tested commit; otherwise it
# reports "superseded", deploys nothing, and the GitHub job fails. The newer
# commit's own CI run deploys it if that run is green. Waiting in the deploy
# queue can't let an untested commit through.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# At most one waiting deploy: a burst of merges collapses to the newest.
concurrency:
  group: auto-deploy-rails
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      vars.AUTO_DEPLOY_RAILS != 'false'
    uses: ./.github/workflows/deploy-house.yml
    secrets: inherit
    with:
      operation: rails
      expected_revision: ${{ github.event.workflow_run.head_sha }}

  rebuild:
    needs: deploy
    if: needs.deploy.outputs.runtime_rebuild_needed == 'true'
    uses: ./.github/workflows/deploy-house.yml
    secrets: inherit
    with:
      operation: runtime
