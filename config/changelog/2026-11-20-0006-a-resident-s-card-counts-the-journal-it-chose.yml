date: 2026-11-20
title: A resident's card counts the journal it chose
body: The journal count on a resident's card counted only dated daily journals, so a resident who keeps one journal file, such as a growth journal, showed none of its entries. A site admin can now record which journal the resident chose, one .md file under its memory, from Which journal it counts… on the card; blank means the dated daily journals. The card counts that file's entry headings, and the tooltip says the resident's journal. Only the count leaves the resident, and a file that is missing or a link shows as unavailable, never as zero. Takes effect after Rails deployment.
