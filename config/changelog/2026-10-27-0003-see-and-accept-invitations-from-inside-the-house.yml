date: 2026-10-27
title: See and accept invitations from inside the house
body: When another account invites you and you already have a login, the account button at the top right now shows a small envelope. Open the menu and an Invitations section lists each account that's waiting, who invited you, and an Accept. Accepting joins you to that account and opens its chats. Before, the invitation existed only in the email. Works once deployed.
clip: invitations
