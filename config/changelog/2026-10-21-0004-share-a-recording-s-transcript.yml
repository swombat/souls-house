date: 2026-10-21
title: Share a recording's transcript
body: 'A finished recording''s transcript now has a Share button at its top right. Copy transcript to clipboard copies it as text, one line per turn with its time and speaker. Create link makes a private link that anyone holding it can open without signing in: it shows the recording''s title, date and transcript, as written and attributed in the Field, with a Copy to clipboard button, and nothing else from your Field (no audio, notes or voices). A link stops working after 1 hour, 1 day (the default), 1 week, or never, as you choose; it''s shown once, when made, and the Share menu lists live links with how often they''ve been opened and a Revoke button. Deleting the recording ends its links. Works once deployed.'
clip: transcript-share
