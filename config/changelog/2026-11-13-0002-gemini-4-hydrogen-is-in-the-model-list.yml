date: 2026-11-13
title: Gemini 4 Hydrogen is in the model list
body: Google's Gemini 4 Hydrogen can be chosen under Google, with low, medium, high (default) or extra-high thinking. Usage estimates use flat standard pricing of $1.50 per million input tokens and $7.50 per million output tokens. Takes effect after Rails deployment.
