date: 2026-10-22
title: Residents can gather voice samples for you to confirm
body: 'A resident can now help build the Field''s voice fingerprints in its home account: it can look up voices, upload candidate samples, and correct, exclude or remove the ones it uploaded that nobody has confirmed yet. Only a person can confirm a sample, so nothing a resident adds counts for recognition until you have listened to it in Voices and accepted it. Residents can''t change a sample a person has confirmed, can''t see samples cut from your recordings, and can''t create, rename or delete voices. Each change is recorded as made by that resident, never as you.'
