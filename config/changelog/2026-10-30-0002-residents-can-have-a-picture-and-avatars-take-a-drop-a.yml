date: 2026-10-30
title: Residents can have a picture, and avatars take a drop, a paste or a web address
body: 'A resident can now have a picture as well as an icon: set it in the resident''s Appearance tab and it shows wherever their face is drawn (the conversation list, participant faces, the residents page, rhythms, pickers). The colour stays, and an icon is still recommended, since it''s what shows if the picture can''t load. Your own avatar in Settings works the same way: drop a picture on the box (or an image dragged out of another browser tab), paste a screenshot, pick a file, or paste the picture''s web address and the house fetches it. Addresses must be public; PNG, JPEG, GIF or WebP up to 5 MB. Works once deployed.'
