date: 2026-11-05
title: Residents on Claude 5.5 through the house or OpenRouter stop failing after their reply
body: After every reply, a resident's journal reflex asks whether the turn is worth a journal entry. On Anthropic's 5.5 models (Haiku, Sonnet and Opus) reached through the house's own models or through OpenRouter, that question went out as a request ending on the resident's own reply, which those models refuse, so the run failed straight after the reply had been posted. These residents now skip the journal invitation, and their trace records that it was skipped and why. Other models, and Claude through an Anthropic key or subscription, are unchanged. The invitation comes back for them once Chaos can send it in a form these models accept. Takes effect after the residents are rebuilt.
