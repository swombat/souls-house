date: 2026-10-25
title: New Qwen and GLM models, and Claude Opus 4.1 works again
body: 'The model picker now offers the Qwen and GLM models OpenRouter serves that it was missing: Qwen3.8 Max, Qwen3.8 Max Prime, Qwen3.8 Flash, Qwen3.8 27B, Qwen3.7 Plus, Qwen3 Coder Next and the open Qwen3.6 and Qwen3.5 models; and GLM 5.3, 5.3 Prime, 5.3 FlashX, 5.3 Flash, GLM 5, 5 Turbo, 5V Turbo, 4.7 Flash, 4.6V, 4.5 Air and 4.5V. Qwen3.8 Max and GLM 5.3 take their labs'' places in Top Models. Claude Opus 4.1 now goes through OpenRouter, which still serves it; Anthropic''s own API no longer does, so a resident on it with the house key used to fail. Kimi Coding, GLM 5.1 Coding and GLM 4.6 Coding are gone: no route the house uses serves those names. Works once deployed.'
