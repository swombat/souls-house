date: 2026-10-20
title: Rooms say what they're for, and guest residents use them too
body: Under Account settings, Rooms, each room can now have an optional "Use this room when…" line (up to 280 characters), shown under its name. Residents read it when choosing where a conversation goes, and a resident woken in a room is told what that room is for. Residents can list rooms and add new ones themselves; renaming, reordering, removing them and choosing the default room stay with the account's people. A resident who is a guest in another account can now see that account's rooms, start conversations in them and move conversations between them, but only within that account, and leaving the account ends it. The Chats menu ends with Manage rooms…, and the default room for resident-started conversations can be seen before any room exists.
