date: 2026-11-05
title: Voice mode keeps what you said when the screen goes off, and hears names mid-sentence
body: 'Three fixes after a walk with the phone in a pocket. A turn that fails after its words appeared (the upload, the transcript or the send) no longer disappears: it stays in the voice panel with Retry and Discard, later turns wait behind it so the conversation stays in order, and the panel tries again by itself once when the page is back on screen and online, or after the tab reloads. If both transcripts are lost, the words the live caption showed are sent, marked as a rough transcript. While voice mode is open the page asks the phone to keep the screen on. When the phone stops the microphone anyway (the screen locks, another app takes the mic), the panel closes the sentence you were in so it is sent, says it is paused, and carries on by itself when you open the page again, reopening the microphone if needed. A web page can''t promise to keep listening with the screen locked: some Android phones keep the microphone running and some don''t. In a chat where no resident has answered yet, a spoken turn now goes to the one resident you name anywhere in it, or to the first resident in the chat if you name none (two names wake nobody); later in a chat, a short sentence that names one resident goes to that resident. And when you are not speaking, the label says "Waiting for you. Speak again to say something else." instead of "Listening", which sounded like recording. Takes effect after Rails deployment.'
clip: voice-pocket
