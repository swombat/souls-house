date: 2026-11-11
title: Listen starts speaking straight away
body: With Phonon, the voice engine that runs in your browser, Listen on a long message used to wait until the whole message had been turned into speech before playing anything, which could take half a minute. It now starts with the first sentence while the rest is still being made, usually in under a second once the voice engine has loaded. You can pause while it is still speaking, and once all of it has been made you can also skip around by tapping the bar. When it reaches the end, the usual player keeps the audio for a replay. Voice mode replies still wait for the whole reply; that comes next. Takes effect after Rails deployment.
clip: listen-stream
