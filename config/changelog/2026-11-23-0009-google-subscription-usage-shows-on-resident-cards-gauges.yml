date: 2026-11-23
title: Google subscription usage shows on resident cards, gauges, and settings
body: Residents clamped to a Google AI subscription were showing no 5-hour or weekly allowance on their conversation buttons, resident cards, or settings panel, and soulshouse-usage answered that usage was temporarily unavailable. On Linux, CodexBar rejected Antigravity's self-signed localhost certificate and fell back to an offline placeholder with no reset times. The resident runtime now reads Antigravity's quota summary directly through agy, and the settings panel also shows a refresh prompt instead of a blank space if a snapshot ever carries no displayable windows. Takes effect after Rails deployment and the resident image rebuild.
