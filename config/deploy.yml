# config/deploy.yml
#
# This file is an ERB template over this checkout's identity, not a plain
# Kamal config: every value that names *this installation* (domain, host,
# ssh, registry, docker gid, storage backend, mail sender, embeddings
# digest) comes from HOUSE_* environment variables, normally supplied by
# config/house.env (gitignored; config/house.env.example is the committed
# starting point). `bin/kamal` loads that file automatically.
#
# See public/self-host.md.

<%
  house_missing = %w[HOUSE_DOMAIN HOUSE_HOST].reject { |key| ENV[key] && !ENV[key].strip.empty? }
  unless house_missing.empty?
    raise "No house configured (missing #{house_missing.join(", ")}). Copy " \
      "config/house.env.example to config/house.env and fill it in — bin/kamal " \
      "loads it automatically. See public/self-host.md."
  end

  async_turns = ENV["SOULSHOUSE_ASYNC_TURNS"]
  unless %w[0 1].include?(async_turns)
    raise "Set SOULSHOUSE_ASYNC_TURNS explicitly to 0 or 1 in config/house.env. " \
      "Use 0 before the runtime canary, then persist 1 after the asynchronous rollout. " \
      "Omitting the setting must not silently disable resident admission."
  end

  house = lambda do |key|
    value = ENV[key]
    if value.nil? || value.strip.empty?
      raise "House value #{key} is required but not set. Copy " \
        "config/house.env.example to config/house.env and fill it in — see " \
        "public/self-host.md."
    end
    value
  end

  house_optional = lambda { |key| ENV[key].to_s.strip.empty? ? nil : ENV[key].strip }

  house_domain = house.call("HOUSE_DOMAIN")
  house_host = house.call("HOUSE_HOST")
  house_ssh_user = house.call("HOUSE_SSH_USER")
  house_ssh_port = house.call("HOUSE_SSH_PORT")
  house_image = house.call("HOUSE_IMAGE")
  house_registry_user = house.call("HOUSE_REGISTRY_USER")
  house_embeddings_image = house.call("HOUSE_EMBEDDINGS_IMAGE")
  house_agent_image = house.call("HOUSE_AGENT_IMAGE")
  house_storage = house.call("HOUSE_STORAGE")
  house_site_name = house.call("HOUSE_SITE_NAME")

  house_docker_gid = house_optional.call("HOUSE_DOCKER_GID")
  house_builder_remote = house_optional.call("HOUSE_BUILDER_REMOTE")
  house_mail_from = house_optional.call("HOUSE_MAIL_FROM")
  house_source_repo = house_optional.call("HOUSE_SOURCE_REPO")
  transition_aliases = house_optional.call("HOUSE_TRANSITION_ALIASES").to_s.split(",").map(&:strip).reject(&:empty?)

  # Canonical HOUSE_EMBEDDINGS_DIGEST; MNEMODYNE_EMBEDDING_IMAGE_DIGEST is kept
  # as a compatibility override (it predates the HOUSE_* vocabulary).
  embedding_digest = ENV["MNEMODYNE_EMBEDDING_IMAGE_DIGEST"].to_s.strip
  embedding_digest = ENV["HOUSE_EMBEDDINGS_DIGEST"].to_s.strip if embedding_digest.empty?
  unless embedding_digest.match?(/\Asha256:[0-9a-f]{64}\z/)
    raise "Set HOUSE_EMBEDDINGS_DIGEST to the approved immutable embedding image digest " \
      "(sha256:...). (Set MNEMODYNE_EMBEDDING_IMAGE_DIGEST to override for compatibility.)"
  end

  web_volumes = [ "/var/run/docker.sock:/var/run/docker.sock" ]
  web_volumes << "souls_house_storage:/rails/storage" if house_storage == "local"

  # WhatsApp connector (services/comms-connector, docs/proposals/2026-10-09-
  # whatsapp-connections.md §2). Off until HOUSE_COMMS_WHATSAPP_IMAGE is set:
  # with it unset nothing here changes, so master's auto-deploy is unaffected.
  # Turning it on needs HOUSE_COMMS_WHATSAPP_DIGEST, HOUSE_COMMS_TLS_DIR (a
  # host directory holding ca.pem, rails.pem/.key and connector.pem/.key) and
  # COMMS_STORE_KEY and COMMS_COMMAND_KEY in .kamal/secrets; see
  # services/comms-connector/README.md "Deploying".
  comms_whatsapp_image = house_optional.call("HOUSE_COMMS_WHATSAPP_IMAGE")
  if comms_whatsapp_image
    comms_whatsapp_digest = ENV["HOUSE_COMMS_WHATSAPP_DIGEST"].to_s.strip
    unless comms_whatsapp_digest.match?(/\Asha256:[0-9a-f]{64}\z/)
      raise "Set HOUSE_COMMS_WHATSAPP_DIGEST to the reviewed connector image digest (sha256:...)."
    end
  end

  # Telegram connector (services/telegram-connector, docs/proposals/2026-10-11-
  # telegram-personal-connections.md, slice S2a). Off until
  # HOUSE_COMMS_TELEGRAM_IMAGE is set, like WhatsApp's. Turning it on needs
  # HOUSE_COMMS_TELEGRAM_DIGEST, HOUSE_COMMS_TLS_DIR (also holding
  # telegram.pem/.key, the certificate for souls-house-comms-telegram), and
  # COMMS_STORE_KEY, COMMS_COMMAND_KEY, TELEGRAM_API_ID and TELEGRAM_API_HASH
  # in .kamal/secrets; see services/telegram-connector/README.md "Deploying".
  comms_telegram_image = house_optional.call("HOUSE_COMMS_TELEGRAM_IMAGE")
  if comms_telegram_image
    comms_telegram_digest = ENV["HOUSE_COMMS_TELEGRAM_DIGEST"].to_s.strip
    unless comms_telegram_digest.match?(/\Asha256:[0-9a-f]{64}\z/)
      raise "Set HOUSE_COMMS_TELEGRAM_DIGEST to the reviewed connector image digest (sha256:...)."
    end
  end

  comms_any = comms_whatsapp_image || comms_telegram_image
  if comms_any
    comms_tls_dir = house.call("HOUSE_COMMS_TLS_DIR")
    web_volumes << "#{comms_tls_dir}:/rails/comms-tls:ro"
  end
%>
service: souls-house
image: <%= house_image %>

registry:
  username: <%= house_registry_user %>
  password:
  - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= house_ssh_user %>
  port: <%= house_ssh_port %> # This is the SSH port for your server

env:
  clear:
    RAILS_SERVE_STATIC_FILES: true # Let Rails serve static files (since no external proxy in production)
    RAILS_LOG_TO_STDOUT: true # Log to STDOUT for Docker logging
    RAILS_ENV: production
    SOULSHOUSE_ASYNC_TURNS: <%= async_turns.inspect %> # Enable only after the runtime canary.
    SOULSHOUSE_AGENTS_NETWORK: kamal # Agent containers join Kamal's private Docker network.
    SOULSHOUSE_AGENT_IMAGE_DEFAULT: <%= house_agent_image %>
    SOULSHOUSE_AGENT_INTERNAL_URL: http://souls-house-web:3000 # Agent callbacks hit Rails over Docker DNS.
    SOULSHOUSE_ACTIVITY_ORIGIN: https://<%= house_domain %> # Purpose-limited lifecycle callbacks use TLS.
    SOULSHOUSE_PUBLIC_URL: https://<%= house_domain %>
    SOULSHOUSE_DOMAIN: <%= house_domain %> # Mailer confirmation, invitation, and password-reset links.
    SOULSHOUSE_SANDBOX_HOST: <%= house_host %> # Stored on promoted agents for operator diagnostics.
    SOULSHOUSE_AGENT_BACKUPS_ENABLED: true # Back up all hosted-agent persistent volumes during the nightly full backup.
    SOULSHOUSE_SITE_NAME: <%= house_site_name %>
    SOULSHOUSE_STORAGE: <%= house_storage %>
<% if house_mail_from %>
    SOULSHOUSE_MAIL_FROM: <%= house_mail_from %>
<% end %>
<% if house_source_repo %>
    HOUSE_SOURCE_REPO: <%= house_source_repo %> # owner/repo the Site Admin deploy page reads and dispatches to.
<% end %>
    MNEMODYNE_EMBEDDING_URL: http://souls-house-embeddings:8080/v1/embeddings
    MNEMODYNE_EMBEDDING_PROFILE: bge-small-en-v1.5-q-52398278842e-fastembed-0.7.4-v1
<% if comms_whatsapp_image %>
    # Rails → WhatsApp connector commands: mutual TLS over the private network
    # (CommsConnector). Setting these is what makes WhatsApp appear on the
    # integrations page (the catalog's requires_env).
    COMMS_WHATSAPP_CONNECTOR_URL: https://souls-house-comms-whatsapp:8443
<% end %>
<% if comms_telegram_image %>
    # Rails → Telegram connector commands, the same way (CommsConnector).
    COMMS_CONNECTOR_URL: https://souls-house-comms-telegram:8443
<% end %>
<% if comms_any %>
    COMMS_CONNECTOR_CLIENT_CERT: /rails/comms-tls/rails.pem
    COMMS_CONNECTOR_CLIENT_KEY: /rails/comms-tls/rails.key
    COMMS_CONNECTOR_CA_FILE: /rails/comms-tls/ca.pem
<% end %>
  secret:
    - RAILS_MASTER_KEY # Rails master key (provide in .kamal/secrets)
    - DATABASE_URL # Database connection string (provided per env in secrets)
    - MNEMODYNE_EMBEDDING_TOKEN # Same private token on web/jobs and embedding accessory.
<% if comms_any %>
    - COMMS_COMMAND_KEY # Signs Rails → connector commands; same value on the connectors.
<% end %>

servers:
  web:
    hosts:
      - <%= house_host %>
    options:
      volume:
<% web_volumes.each do |volume| %>
        - <%= volume %>
<% end %>
<% if house_docker_gid %>
      group-add: <%= house_docker_gid %> # Host docker group; lets the non-root rails user use the mounted socket.
<% end %>
      network-alias:
        - souls-house-web
<% transition_aliases.each do |alias_name| %>
        - <%= alias_name %> # transition alias (HOUSE_TRANSITION_ALIASES); remove once nothing depends on the old callback URL
<% end %>
  jobs:
    hosts:
      - <%= house_host %>
    cmd: "./bin/rails solid_queue:start"
    options:
      volume:
<% web_volumes.each do |volume| %>
        - <%= volume %>
<% end %>
<% if house_docker_gid %>
      group-add: <%= house_docker_gid %> # Host docker group; needed for PromoteAgentJob to spawn agent containers.
<% end %>

proxy:
  ssl: true
  hosts:
    - <%= house_domain %>
  app_port: 3000
  response_timeout: 120

builder:
  arch: amd64
<% if house_builder_remote %>
  local: false # Kamal otherwise prefers the local host when architectures match.
  remote: <%= house_builder_remote %>
<% end %>
  args:
    RAILS_ENV: production
  cache:
    type: registry
    options: mode=max
    image: <%= house_image %>:production-build-cache

accessories:
  embeddings:
    # Build/publish this artifact after review; see docs/mnemodyne-deployment.md.
    image: <%= house_embeddings_image %>@<%= embedding_digest %>
    host: <%= house_host %>
    env:
      secret:
        - MNEMODYNE_EMBEDDING_TOKEN
    options:
      memory: 512m
      cpus: 2
      read-only: true
      tmpfs: /tmp
    # No public port. Kamal's private network supplies souls-house-embeddings.
<% if comms_whatsapp_image %>
  comms-whatsapp:
    # Built from services/comms-connector (Dockerfile there), reviewed, pushed,
    # pinned by digest. Boot it with `bin/kamal accessory boot comms-whatsapp`;
    # it survives web deploys. One process, one worker per connection, each
    # holding a flock on /data/<connection>/lease.
    image: <%= comms_whatsapp_image %>@<%= comms_whatsapp_digest %>
    host: <%= house_host %>
    env:
      clear:
        COMMS_RAILS_URL: http://souls-house-web:3000 # Signed events, over Docker DNS like agent callbacks.
        COMMS_LISTEN: ":8443"
        COMMS_DATA_DIR: /data
        COMMS_TLS_CERT: /tls/connector.pem
        COMMS_TLS_KEY: /tls/connector.key
        COMMS_TLS_CLIENT_CA: /tls/ca.pem
        COMMS_TLS_CLIENT_NAME: rails # Only Rails's client certificate is accepted.
        GOTRACEBACK: none
      secret:
        - COMMS_STORE_KEY # base64 of 32 bytes; each connection's SQLCipher key is HKDF(it, connection).
        - COMMS_COMMAND_KEY
    volumes:
      - comms:/data # The linked devices' session stores. Losing it costs a re-pair, not history.
      - <%= comms_tls_dir %>:/tls:ro
    options:
      ulimit: core=0 # This host pipes cores to apport; no core may hold keys or messages.
      read-only: true
      tmpfs: /tmp
      memory: 512m
      cpus: 1
    # No public port. Kamal's private network supplies souls-house-comms-whatsapp.
<% end %>
<% if comms_telegram_image %>
  comms-telegram:
    # Built from services/telegram-connector (Dockerfile there), reviewed,
    # pushed, pinned by digest. Boot it with `bin/kamal accessory boot
    # comms-telegram`; it survives web deploys. One process holds every
    # Telegram session. An accessory is one named container, never rolled:
    # `bin/kamal accessory reboot comms-telegram` stops and removes the old
    # one before the new one starts, and the process also takes a flock on
    # /data/.lease before it opens the store or any Telegram client, so a
    # straggler or a second container on the volume waits, unavailable,
    # until the holder has exited.
    image: <%= comms_telegram_image %>@<%= comms_telegram_digest %>
    host: <%= house_host %>
    env:
      clear:
        COMMS_RAILS_URL: http://souls-house-web:3000 # Signed events, over Docker DNS like agent callbacks.
        COMMS_LISTEN: ":8443"
        COMMS_DATA_DIR: /data
        COMMS_TLS_CERT: /tls/telegram.pem
        COMMS_TLS_KEY: /tls/telegram.key
        COMMS_TLS_CLIENT_CA: /tls/ca.pem
        COMMS_TLS_CLIENT_NAME: rails # Only Rails's client certificate is accepted.
      secret:
        - COMMS_STORE_KEY # Seals sessions, secrets and the outbox; HKDF per connection (its own salt).
        - COMMS_COMMAND_KEY
        - TELEGRAM_API_ID # The Telegram application the house signs users in through.
        - TELEGRAM_API_HASH
    volumes:
      - comms_telegram:/data # The sessions and the outbox. Losing it costs a new sign-in, not history.
      - <%= comms_tls_dir %>:/tls:ro
    options:
      ulimit: core=0 # No core may hold a session key, a password or messages.
      read-only: true
      tmpfs: /tmp
      memory: 512m
      cpus: 1
      stop-timeout: 30 # SIGTERM first: the process stops its clients and releases the lease.
    # No public port. Kamal's private network supplies souls-house-comms-telegram.
<% end %>
  postgres:
    image: postgres:16.2 # Use the correct version for your app
    host: <%= house_host %>
    env:
      clear:
        # initdb-only vars — the existing data volume (renamed cluster) ignores them; kept in sync for clarity
        POSTGRES_USER: souls_house
        POSTGRES_DB: souls_house_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data # Persist db data on host (named volume "data")
