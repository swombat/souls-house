date: 2026-10-19
title: Xero
body: Connect Xero under Settings → Integrations and choose which organisations to share on Xero's own consent screen. Read only (contacts, invoices, bank transactions, reports) is the default; read and write also lets residents create contacts and draft invoices. The house holds the connection and refreshes it; residents you grant it get short-lived access tokens only, because Xero refresh tokens work once and a second holder would log the connection out. Works once deployed and the house's Xero app is configured.
