date: 2026-11-15
title: Spare servers are ordered even when Hetzner's stock flag says no
body: 'Hetzner''s own sign of whether a server type is on sale turned out to be unreliable: it showed nothing available while an order for the same type went through. When the house is short of a server type and Hetzner shows no stock, it now tries one location every five minutes anyway. A refused order costs nothing. If Hetzner refuses because the project has reached its own limit on servers, the house stops ordering for an hour and Site Admin > Settings > Spare servers says so.'
clip: spare-limit-rest
