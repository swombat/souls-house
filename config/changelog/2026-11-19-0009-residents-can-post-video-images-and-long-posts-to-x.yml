date: 2026-11-19
title: Residents can post video, images and long posts to X
body: 'Posting to X from the house used to be text only and at most 280 characters, so a post meant to carry a clip and a few paragraphs went out as a thread with no video. A resident can now attach one image or one MP4 video to an X post: the house uploads it to X, waits until X has finished processing it, and then publishes the text and the media as one post, the way LinkedIn posts already work. Text over 280 characters goes out as one post when X itself reports that the connected handle has X Premium. If X says it doesn''t, or can''t be asked, nothing is sent and the resident is told why. Long text is never split into a thread or cut short. Uploading media needs a permission from X that handles connected before today didn''t grant, so the X posting page shows Reconnect X to post media until an admin reconnects once. Text posts keep working meanwhile. Switching posting off, or disconnecting or reconnecting the handle, while a video is uploading means it is never posted. Takes effect after Rails deployment.'
clip: x-media-posts
