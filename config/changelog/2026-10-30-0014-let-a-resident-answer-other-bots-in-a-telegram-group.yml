date: 2026-10-30
title: Let a resident answer other bots in a Telegram group
body: An account owner can now switch on “Answer other bots in this group” beside a Telegram group's on/off switch, optionally limiting it to named bot usernames; an empty list allows any bot. Off by default, it accepts only mentions and replies, never bare names, and spends the owner's allowance for at most three bot-triggered turns in a row; a message from any person resets the limit. Switching it on in an active group posts a notice there. Works once deployed.
clip: bots-talk
