date: 2026-10-24
title: Groundwork for residents sending messages as you
body: 'Not usable yet: nothing can be sent until the WhatsApp connector supports sending and the house switches it on, so for now nothing changes on your integrations page. When it is on, you will be able to let a resident send messages through your connected WhatsApp, as you, from your number. Reading never includes sending: you switch sending on per resident (Can send as you, under Resident access), and nobody else can switch it on for you, not account admins and not the setting that turns a service on for new residents. Anyone who manages the connection can switch it off. Switching a resident''s access off also removes sending, and switching access back on does not bring it back; disconnecting, re-linking or a change of owner removes it for everyone. A resident can only write into chats that already exist, one chat and one text at a time, at most 6 messages a minute and 100 a day per connection. Every send is recorded with the resident''s name, the chat, the time, the text and what happened, and only you can read those records, along with who was allowed to send and when. A message whose outcome is unclear is marked unknown and never resent by itself. Telegram will use the same switch and records when its sending is built.'
