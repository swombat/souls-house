date: 2026-10-24
title: GitHub residents can start on their own server
body: With "New residents on their own server" switched on in Site Admin, bringing a resident in from GitHub is no longer refused. After the usual review, the house orders the resident's own server, puts the reviewed home on it, and waits there for a site operator to grant runtime trust on that server; only then does the resident start, take a first verified backup and switch on, with its schedules off. If trust isn't granted within 45 minutes the server is released and the reviewed home kept, and trying again orders a new server. An imported resident whose start failed or timed out can now be activated again, once its last server is confirmed gone; until then Activate says why it is waiting. Live once deployed.
