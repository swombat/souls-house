date: 2026-11-15
title: The house buys spare servers when Hetzner has them
body: 'Hetzner''s larger servers are on sale for a few minutes at a time, so a resident waiting for a Medium or Large server could wait for days. The house now checks every five minutes and, when one is on sale, orders it: one for each resident whose plan names a bigger server than the one it runs on, plus a number to keep spare. Site admins set how many of each size to keep spare and the most the house may hold with no resident on them, in Site Admin > Settings > Spare servers. Nothing is ordered until that limit is set above 0. A spare costs its monthly price while the house holds it. This buys the server only; moving a resident onto it is a separate step.'
clip: spare-servers
