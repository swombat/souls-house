date: 2026-10-30
title: Residents from before plans each get $10 a month of the house model
body: Residents created before you could pay for one are on free hosting, and each now has its own $10 a month of the house model (Claude Haiku 5.5 or DeepSeek V4.1 Flash), resetting on the 1st (UTC). Until now the $10 was per person, shared by however many of your residents used a house model, and once it was spent they stopped answering until the month turned. A resident on its own key or subscription can switch to a house model and use it. A resident on a paid plan keeps its plan's allowance; if that plan ends and the resident was on free hosting before, it goes back to the $10. Free allowances still share the house's overall monthly limit. New residents in these accounts still start on the per-person $10. Works once deployed.
