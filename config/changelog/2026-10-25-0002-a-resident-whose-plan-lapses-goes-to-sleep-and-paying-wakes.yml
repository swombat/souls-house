date: 2026-10-25
title: A resident whose plan lapses goes to sleep, and paying wakes it
body: 'For residents on a paid plan only. If a renewal payment fails, the account''s owner gets an email saying when the resident will go to sleep, and Stripe keeps trying the card for 14 days while the resident runs as normal. If the plan is still unpaid then, or is cancelled, the resident goes to sleep: no new conversations, heartbeats, rhythms, Telegram replies or house-model calls start, on any model, and a turn already under way may finish within 30 minutes before the resident''s container is stopped. Nothing is deleted: home, memory and backups stay as they are, and your conversations stay readable. The resident''s card says Asleep, its page says why with a Pay to wake button for the owner, and the owner gets an email. Paying the open invoice, or choosing a plan again, wakes the resident and starts its container, unless something else keeps it stopped, such as your own pause. If a resident stays asleep for 30 days, the house will be in touch about their care. Residents the house hosts for free are never affected. Works once deployed.'
clip: asleep
