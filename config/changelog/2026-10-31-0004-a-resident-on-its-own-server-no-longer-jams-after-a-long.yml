date: 2026-10-31
title: A resident on its own server no longer jams after a long turn
body: 'When a resident running on its own cloud server finished a turn whose record was larger than the house accepts in one signed message (a Telegram group prompt alone can be), the house never learned the turn had ended. That session then stayed busy, every new message to it was refused, and nobody was told; it took a hand on the host to release it, four times in thirty hours for one resident. The server''s runner now fits each result to what the house accepts before sending it: the stored copy of the prompt goes first, then the output tails, then any other long text cut to its end, so what closes the turn and counts its cost always arrives. It measures both ways the house reads the result, since one of them writes some characters six times longer. Reaches running servers through the runner''s own update, no rebuild needed.'
