date: 2026-11-25
title: Account settings are grouped, with a new Features tab
body: The account settings rail now has four headed groups (Account, Conversations, Residents, Transcription), and Users shows only on team accounts. General keeps just the name, the logo colour and the account type. The switches that change what happens in conversations moved to a new Features tab, each with one sentence and a Watch example clip, and switches the site has fixed for everyone are no longer shown. Interface is now Tags, Voices is now Speakers, and the Field links to Speakers and Glossary.
