date: 2026-10-22
title: Merge two speakers who are one person
body: 'In Account settings → Voices, a speaker has Merge with other speaker: search for the other name (Ants and Ant Hiron, say), choose which name to keep, and they become one speaker. Every transcript naming either shows the kept name, suggestions use it, and their samples are pooled into one fingerprint, keeping the confirmations you already gave. Two different account members can''t be merged. Works once deployed.'
clip: speaker-merge
