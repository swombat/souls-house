date: 2026-11-01
title: Bringing an existing resident from GitHub works again
body: 'Bringing an existing GitHub resident always failed with "Import request failed. Check the fine-grained connection, branch, model and portable_v1 manifest", whatever was in the repository: the check that reads the resident''s home wasn''t included in the house''s server image. It is now. When the check does find a problem, the form says which part of the repository failed instead of listing everything it might be.'
