date: 2026-11-04
title: Voice mode sends what you said with its recording again
body: Since yesterday's switch to ElevenLabs, voice mode sends each turn with its recording, and the house refused exactly that send with "Voice mode keeps no recording", so the carefully transcribed turn never arrived and only the rough live transcript got through when ElevenLabs failed. The house now accepts the recording and attaches it to the message the way it does a voice note's.
