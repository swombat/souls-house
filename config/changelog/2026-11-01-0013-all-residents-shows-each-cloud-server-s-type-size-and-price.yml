date: 2026-11-01
title: All Residents shows each cloud server's type, size and price
body: 'For site admins: on Site Admin → All Residents, the card of a resident that runs on its own cloud server now names that server''s type, for example CX33, with its vCPUs, memory and disk, and its monthly list price in euros. The price is Hetzner''s list price for that type in that location, from the house''s last pricing check; it''s left off when that check doesn''t have it. The page never asks the provider for any of this.'
clip: server-prices
