date: 2026-10-27
title: Voice samples play straight away, and twenty is enough
body: 'On a voice''s page, Play used to sit silent for up to fifteen seconds on a long recording while the house fetched and cut the clip, and clicking again in that gap showed a red "could not be played". Now the house cuts the first eight samples in the background as soon as the list opens, and the next ones as you play, fetching and decoding each recording once for all of them. The button spins until sound starts, and stopping or switching mid-load is no longer reported as an error. The clips are exactly what the fingerprint uses, and are held only in the server''s memory. Once a voice has twenty included samples, which is as many as a fingerprint uses, no new candidates are offered for review: any still waiting show as "Not needed" without an Accept button, and the page says why instead of asking you to remove old ones. Reject one and candidates are offered again. Works once deployed.'
