date: 2026-11-25
title: Rhythm runs with several residents can tidy themselves away
body: A rhythm run with one resident already stays off the conversation list while nothing in it needs anyone. Now a run with several residents can do the same. Once its opening round has ended, if nobody was flagged and no person spoke in it, the resident whose turn finished last is woken once, briefly, and asked whether the run needs a person. If not, it marks the run done with one of the account's tags that hide from the list, or archives it (archiving is only offered at home). If something in it should be seen, it leaves it. Nothing is archived automatically, and each run is asked about only once.
