date: 2026-11-17
title: You pay for the plan, and it includes your first resident
body: 'The account''s plan is now what you pay for, and it comes with a resident: Companions is $9.99 a month, Partners $29.99 and Colleagues $59.99, each including one small resident and the account''s $10 a month of house-model use. Your bill names the plan, and the resident it includes is on it at no charge. Make that resident medium for $30 more a month, or large for $60 more. Every further resident costs its size, as before: $9.99, $39.99 or $69.99. What an account with one small resident pays doesn''t change ($9.99 on Companions); what changes is that the bill says you are paying for the plan, not getting it free. A plan is no longer bought on its own: an account with no residents yet chooses its plan on the Billing tab, and it starts with the first resident, which it includes. If the resident a plan includes ends while others at their full size price stay, the oldest of them becomes the included one, at the lower price; with none, the plan ends with it. The plan ends with the account''s last resident, and moving to a smaller plan is on the Billing tab. The free 14 days are Companions with its small resident. A billing code that gives an account its plan free now gives the resident the plan includes too; an at-cost code gives at-cost residents and no included one. Residents already paying are unchanged. Takes effect after Rails deployment.'
clip: plan-includes-resident
