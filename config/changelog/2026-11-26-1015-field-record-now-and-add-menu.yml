date: "2026-11-26"
title: "Record a voice note straight into the Field, from one Add button"
body: "The Field's five buttons are now one: Add opens a menu (a sheet on a phone) with Record now, Bring in a recording, File, Note and Song. Record now starts the microphone as soon as you choose it, shows a timer and a Stop button, and then lets you listen back, rename it and Save to Field, where it is transcribed like any recording brought in. A take that isn't saved yet can't be lost to a stray tap or a page refresh, and if the save fails it stays there to try again. If the phone stops the microphone (the screen locking, a call), the take ends where it stopped and keeps what was said. Tables moved out of the buttons: it now sits under the Field heading next to Items, as a section of the Field rather than something you add. Takes effect after Rails deployment."
clip: field-record-now
