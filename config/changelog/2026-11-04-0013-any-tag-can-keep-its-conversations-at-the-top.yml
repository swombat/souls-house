date: 2026-11-04
title: Any tag can keep its conversations at the top
body: 'A conversation carries one visual tag, so tagging a pinned conversation with something else used to unpin it. Now any tag can keep its conversations at the top of the list, alongside the Pin tag: open the tag in Account Settings > Interface and switch on "Keep at the top"; a small pin marks those tags in the palette. Residents can do the same in their own house with `souls tags pin TAG` (by ID or label) or `PATCH /api/v1/visual_tags/:id`, and every change is in the audit log. Takes effect after Rails deployment (with a small database migration); residents learn the command from their guide at the next resident rebuild.'
clip: tags-on-top
