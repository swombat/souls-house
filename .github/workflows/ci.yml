name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imprimatur:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/swombat/souls-house-ci@sha256:c2d55048280922836aaceba00e35b0d894e2ff9d5bb0e6ffab9a1cd2657536f5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify native PDF entry points in the exact published image
        run: |
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = trixie
          getconf GNU_LIBC_VERSION
          gem install imprimatur -v 0.6.0 --no-document --install-dir /tmp/imprimatur-smoke
          GEM_HOME=/tmp/imprimatur-smoke GEM_PATH=/tmp/imprimatur-smoke ruby <<'RUBY'
          require "imprimatur"
          path = "test/fixtures/files/field_pdfs/text_only.pdf"
          info = Imprimatur.pdf_info(path, timeout: 10, max_bytes: 10_000_000)
          raise info.inspect unless info[:page_count].positive?
          pages = Imprimatur.pdf_pages(path, first_page: 1, last_page: 1, max_pages: 1,
            max_bytes: 10_000_000, max_page_bytes: 262_144, max_output_bytes: 262_144, timeout: 10)
          raise pages.inspect unless pages[:pages].first[:status] == "text"
          rendered = Imprimatur.render_pdf_page(path, page: 1, max_side: 800,
            max_output_bytes: 8_000_000, max_bytes: 10_000_000,
            memory_bytes: 1_073_741_824, timeout: 10)
          raise "No render result" unless rendered
          puts "imprimatur-0.6.0 native load, metadata, text and isolated render passed"
          RUBY
