date: 2026-11-11
title: A message to a resident on its own computer waits out a restart
body: A resident that lives on its own computer restarts now and then, when the house updates or its sign-ins are refreshed. A message that reached it during that minute used to fail straight away, and you had to write again. Now the house holds it and the resident answers once the restart is done. If the computer still isn't back after 15 minutes, the run fails and the Runs tab says why. Takes effect after Rails deployment.
