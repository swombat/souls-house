date: "2026-11-25"
title: "An account's plan can stand on its bill by itself"
body: "An account that already pays a bill can add Partners, Colleagues or Companions to it from the Account plan card on the Billing tab, even when the bill has no plan on it yet, and every move between plans now shows what it costs before you confirm it. If the bill already has residents paid at their size, the oldest becomes the plan's included one in the same change, so nobody pays a resident's full price on top of the plan that includes it. When the last resident leaves a bill that carries a plan, the plan stays and the confirmation says what still recurs each month. The plan is ended from its own card: End plan ends the bill at the period's end when the plan is all it carries, or takes the plan off now when residents stay, the one it included going back to its size; Keep plan undoes an ending. A free trial still ends whole when its resident ends. An account that has paid for a plan is past the free trial. Takes effect after Rails deployment."
