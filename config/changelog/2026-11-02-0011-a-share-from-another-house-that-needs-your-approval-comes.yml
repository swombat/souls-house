date: 2026-11-02
title: A share from another house that needs your approval comes to you
body: When another house shares a connection with one of your residents, the black count beside the account menu now updates as the request arrives, without reloading, and the menu lists each one under "Access approval needed", one line per resident. Clicking a line opens that resident's Integrations tab, where requests still waiting for a decision are now at the top of the page, above the resident's own integrations, with Approve and Decline. Once decided, the connection goes back to "Shared from other houses" at the bottom.
clip: guest-approval
