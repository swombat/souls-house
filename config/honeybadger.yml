---
# For more options, see https://docs.honeybadger.io/lib/ruby/gem-reference/configuration

api_key: "<%= Rails.application.credentials.dig(:honeybadger, :api_key) %>"

# The environment your app is running in.
env: "<%= Rails.env %>"

# The absolute path to your project folder.
root: "<%= Rails.root.to_s %>"

# Honeybadger won't report errors in these environments.
development_environments:
- test
- development

# By default, Honeybadger won't report errors in the development_environments.
# You can override this by explicitly setting report_data to true.
# report_data: true

# The current Git revision of your project. Defaults to the last commit hash.
# revision: null

# Enable verbose debug logging (useful for troubleshooting).
debug: false

# Enable Honeybadger Insights
# Honeybadger doesn't read Rails' filter_parameters. These are its defaults
# plus the native app's cable ticket, which travels in Sec-WebSocket-Protocol.
request:
  filter_keys:
  - password
  - password_confirmation
  - HTTP_AUTHORIZATION
  - HTTP_SEC_WEBSOCKET_PROTOCOL
  - ticket

insights:
  enabled: true

# Individual SQL queries were 94% of Insights events (1.8M of 1.93M in a week)
# and filled the free daily allowance by mid-morning. Requests and jobs stay.
# Added to the gem's default ignores (Config#raw_ignored_events unions them).
# Still capped at ~13:20 UTC on 10 Nov (~190k events), so the next-biggest
# noise goes too: the SolidCable trim job (~44k performs before the cap),
# runner command polling (~20k), resident runtime event ingest (~15k) and
# outbound HTTP (~19k). Human-facing pages and the other jobs stay.
# Hash entries match payload fields; values are regexes.
events:
  ignore:
  - sql.active_record
  - request.net_http
  - event_type: "active_job"
    job_class: "^SolidCable::TrimJob$"
  - event_type: "^process_action\\.action_controller$"
    controller: "^Api::V1::HostRunner::CommandsController$"
    action: "^next$"
  - event_type: "^process_action\\.action_controller$"
    controller: "^Api::V1::RuntimeEventsController$"
    action: "^create$"
