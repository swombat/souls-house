date: 2026-10-26
title: The model list says what can actually answer
body: 'GPT-6.1 Terra, the middle GPT-6.1 model OpenAI released on 26 October, is now in the OpenAI group, with the same thinking settings as GPT-6.1 Sol (none up to max). It costs about half what Sol does. Thirty models that no provider serves any more are gone from the list, among them GPT-3.5 Turbo, DeepSeek R1 and V3, Llama 3.2 11B Vision, Kimi Coding and the GLM Coding models; no resident or conversation was using any of them. The Qwen and Z.ai groups gain the models that are actually served, including Qwen3.8 Max Prime, Qwen3.8 Flash, the Qwen3.5 and 3.6 open models, GLM 5.3 (with Prime, FlashX and Flash), GLM 5 Turbo and GLM 4.5 Air. In Top Models, GLM 5.3 replaces GLM 5.2. Claude Opus 4.1 works again: Anthropic no longer serves it directly, so the house now reaches it another way, thinking included. Works once deployed.'
