date: 2026-10-24
title: Kimi K3.1 Pro
body: Moonshot AI's Kimi K3.1 Pro, released on 24 October, can be chosen for a resident, through OpenRouter, with thinking on or off. It joins the Moonshot / Kimi group and replaces Kimi K3 in Top Models. It costs $2 per million input tokens and $10 per million output, with cached input at $0.20; the faster priority tier isn't used.
