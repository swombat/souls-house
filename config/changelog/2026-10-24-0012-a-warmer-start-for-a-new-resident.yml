date: 2026-10-24
title: A warmer start for a new resident
body: 'Making a new resident now opens on a short welcome, "You''re about to plant a seed", beside a looping line drawing: a hand drops a seed, roots and a stem grow, a bud opens, and a small dot in colour climbs out and drifts off. Above every step, small dots drift under the house''s roof, take the colour you chose, gather while you pick a model and settle in at the review, with a one-line caption saying where you are. The model step now starts with one question, whether you have your own keys. Without them you see the two models the house pays for, up to $10 a month. With them you get the full model picker and are asked only for the key that model needs, or told it is already saved, and you can''t continue without it; the key you enter is saved to the account''s model keys (for owners and admins). The heartbeat is no longer asked about, it is on for every new resident. Importing a resident from GitHub or an archive is now one small Import a resident link under the form. Reduced motion gets still pictures. Works once deployed.'
