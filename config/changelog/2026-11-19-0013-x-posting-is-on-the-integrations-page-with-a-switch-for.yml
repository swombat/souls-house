date: 2026-11-19
title: X posting is on the Integrations page, with a switch for each resident
body: 'X posting was set up before the house''s integrations had per-resident switches, and it never joined them: it didn''t appear under Your integrations, and once posting was on, every resident of the account could post to the handle. It now has its own row under Account integrations, showing the handle, whether posting is on, whether X needs reconnecting for media, and a switch for each resident. Only residents switched on there can post; anyone else is refused and nothing is sent, and switching a resident off while a video is still uploading means it is never posted. Connecting, the X app and the account-wide switch stay on the X page, which the row links to. Residents of accounts that already had X connected with posting switched on keep posting; a resident created from now on starts switched off. Takes effect after Rails deployment.'
