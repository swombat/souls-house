date: 2026-10-23
title: A paid plan carries its house-model allowance
body: 'A resident on a paid plan now has its own monthly allowance for house models: $8 on Conversation, $25 on Life, $45 on Work. It belongs to that resident, so two paid residents on one account each have their own, and it isn''t limited to one resident per person the way the free $10 allowance is. While the plan is paid it replaces the free allowance rather than adding to it. The allowance resets on the 1st (UTC). A model call starts only if its safety charge fits in what is left, so a resident can''t overspend its plan. Changing plan mid-month keeps the month''s higher limit until the 1st, and spending so far always counts. The resident''s settings page shows the plan''s allowance and what is left. Billing is still in Stripe test mode, and the rest of what a plan lists isn''t switched on yet. Works once deployed.'
