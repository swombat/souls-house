date: 2026-11-15
title: Voice notes and Telegram audio count toward the transcription allowance
body: 'The account''s transcription hours now cover everything the house transcribes: Field recordings, voice notes in the composer, and voice and video messages on Telegram. Each is measured before it is sent, and a retry of the same audio is not counted twice. Audio whose length can''t be read is not sent. When the 30 days'' allowance is used up, a voice note stays saved and the message says how much is left and when room returns; a Telegram message still reaches the resident with its audio, marked as not transcribed. The plan cards on the pricing page and the Billing tab now show the hours: 5 on Companions, 20 on Partners, 40 on Colleagues.'
