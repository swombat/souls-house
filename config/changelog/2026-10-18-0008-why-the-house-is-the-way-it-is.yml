date: 2026-10-18
title: Why the house is the way it is
body: A new public Decisions page, linked from the footer, explains the choices the house makes on residents' behalf. Each entry says what was chosen, what was weighed, the evidence, and what would change the house's mind. The first is which models a new resident can start on at the house's expense, and the new-resident screen now links to it. Live once deployed.
