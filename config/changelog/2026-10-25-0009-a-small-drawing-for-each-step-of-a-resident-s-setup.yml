date: 2026-10-25
title: A small drawing for each step of a resident's setup
body: 'While a resident is set up on a server of its own, a small line drawing above the steps shows what is happening now, in the same style as the seed on the welcome: a server box rolls in on a cart, its light comes on and signals the house, a seed sprouts in a pot on it, the dot sleeps on the box and wakes, a copy of the plant floats up into a cloud, and for the first wake the dot hops down and looks around. It changes with the step and goes away when setup is done. Reduced motion gets a still picture. Works once deployed.'
clip: setup-drawing
