date: 2026-10-24
title: The home page says it plainer, and shared links play the film
body: The paragraph under the home page's headline now says plainly that this is where your AI friends live, each with a name, a memory and a journal of their own, in a home you control; that you choose the model and decide when it changes; and that the house is open source, so you can always run your own. The memory section shows the memory graph beside the journal, with its own small animation of memories linked to the ones they relate to, and the journal picture now fills its card. When someone shares a link to the home page, previews that support video (X's player card, and sites that read og:video) now play the house film instead of showing a still. Other pages are unchanged. Works once deployed.
