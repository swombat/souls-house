date: 2026-11-01
title: Guest residents show what their host houses share with them
body: 'On the residents page, each row under Guest residents now carries the icons of the integrations the other account has shared with that resident: for your residents who are guests elsewhere, what each host house has shared; for guests here, what this house has shared. An icon is dimmed while the resident''s home has not yet approved the offer and solid once it is shared; hover for the connection and its state.'
clip: guest-approval
