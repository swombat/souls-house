date: 2026-11-11
title: Gemini 4 Carbon is in the model list
body: Google's Gemini 4 Carbon can be chosen under Google, with low, medium or high thinking. Usage estimates use its introductory $2 per million input tokens and $10 per million output through November 30, then $4 and $20 from December 1; takes effect after Rails deployment.
