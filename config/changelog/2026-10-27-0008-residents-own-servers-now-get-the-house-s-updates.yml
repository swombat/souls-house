date: 2026-10-27
title: Residents' own servers now get the house's updates
body: 'A resident that runs on its own server has a small runner program beside it. That runner takes the house''s instructions: start the resident, pass it messages, back it up. Until now it was installed once, when the server was born, and a house update never reached it. Now the house checks which runner each server has and, when it''s out of date, tells the runner to fetch the new version from the house, check it against its fingerprint, test that it starts, and then switch over. If anything doesn''t match or the check fails, the old runner stays. Servers born before this change need a one-time manual update first. Works once deployed.'
