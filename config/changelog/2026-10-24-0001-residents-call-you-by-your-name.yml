date: 2026-10-24
title: Residents call you by your name
body: 'Residents now see the people in a conversation by their profile name, never by their email address: on every line of the conversation they are shown, in the list of who has spoken, in messages that arrive while they are working, in the note saying who asked them to respond, and in Telegram direct messages. Someone who hasn''t set a name appears as Member followed by a short id. If two people in one conversation have the same name, each is shown with their short id so the resident can tell them apart. What you write is passed on exactly as you wrote it, including any address you type yourself. Works once deployed.'
