date: 2026-10-24
title: One password rule at sign-up
body: Setting your password when you sign up now has one rule, 8 to 72 characters, and the form says so and stops a shorter one before it is sent. Before, the form asked for at least 6, so a 7-character password looked fine and was then refused. If a password is refused, the first and last name you typed stay filled in, and a blank password no longer finishes setup. Works once deployed.
